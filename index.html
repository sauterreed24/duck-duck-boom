/* ---------- per-frame update for the launch screen ---------- */
function updateLaunch(dt) {
  if (!S.race) return;
  const pace = PACE();
  L.pt += dt;
  L.squash = Math.max(0, (L.squash || 0) - dt);
  switch (L.phase) {
    case 'intro':
      L.dock = 0;
      if (L.pt >= 1.5 * pace) setPhase('ladder');
      break;
    case 'ladder': {
      L.dock = easeInOut(L.pt / (0.45 * pace));
      if (L.pt > 1.6 * pace && !L.crankSnd) { L.crankSnd = true; SFX.play('crank', 4); }
      if (L.pt >= 2.5 * pace) { L.crankSnd = false; setPhase('armed'); }
      break;
    }
    case 'armed':
      L.dock = 1;
      if (S.settings.autoAdvance && L.pt > 0.7) lightFuse();
      break;
    case 'countdown': {
      const T = L.cdT || 3 * pace;
      const tick = Math.floor(L.pt / (T / 3));
      if (tick !== L.ticks && tick < 3) { L.ticks = tick; SFX.play('count', 3 - tick); }
      const lockAt = T * 2 / 3 + 0.05 * T;
      if (!L.gauge.locked && L.pt >= lockAt) { L.gauge.locked = true; L.gauge.a = L.tl.angle; L.gauge.p = Math.round(L.tl.power * 100); L.barrelFrom = L.barrel; L.lockT = L.pt; SFX.play('crank', 3); }
      if (L.gauge.locked) L.barrel = lerp(L.barrelFrom, L.tl.angle, easeInOut((L.pt - L.lockT) / 0.3));
      if (L.fuseOut) {
        if (L.pt >= T * 2 / 3 && !L.fizzled) { L.fizzled = true; SFX.play('fizzle'); say('fakeout', {}, { prio: 2, delay: 0.5 }); }
        if (L.pt >= T + 2.6) { L.fizzled = false; say('fakeoutBoom', {}, { prio: 2, delay: 0.2 }); startFlight(false); }
      } else if (L.pt >= T) startFlight(false);
      break;
    }
    case 'flight':
      updateFlight(dt);
      break;
    case 'result':
      if (L.pt >= 2.5 * pace) setPhase('idle');
      if (L.tl) { const s = sampleTL(L.tl, L.tl.endT); L.cam.cx = approach(L.cam.cx, s.x + 60 / L.cam.z * 3, 2, dt); L.cam.z = approach(L.cam.z, 3.0, 1.5, dt); L.cam.gy = approach(L.cam.gy, GROUND_Y, 3, dt); }
      break;
    case 'idle':
      if (S.settings.autoAdvance && L.pt > (S.race.idx >= S.race.queue.length ? 2.0 : 0.6)) nextDuck();
      if (L.tl) { const s = sampleTL(L.tl, L.tl.endT); L.cam.cx = approach(L.cam.cx, s.x + 60 / L.cam.z * 3, 2, dt); L.cam.z = approach(L.cam.z, 3.0, 1.5, dt); L.cam.gy = approach(L.cam.gy, GROUND_Y, 3, dt); }
      break;
  }
  if (L.phase !== 'countdown') L.ticks = -1;
  // gauges spin until locked
  if (!L.gauge.locked && (L.phase === 'ladder' && L.pt > 0.9 * pace || L.phase === 'armed' || L.phase === 'countdown')) {
    L.gauge.a = 35 + 25 * (0.5 + 0.5 * Math.sin(S.time * 4.7));
    L.gauge.p = 70 + 30 * (0.5 + 0.5 * Math.sin(S.time * 6.3 + 1.2));
  }
}


/* ---------- drawing the launch screen ---------- */
const POSE_NAME = ['fly', 'scared', 'dizzy', 'sleep', 'eat', 'smug', 'scared', 'carried', 'glide', 'dizzy', 'happy', 'carried', 'dizzy', 'stand', 'swim', 'rocket', 'dizzy', 'scared'];
let LowRes = null;
function duckDrawOpts(pl, extra) {

}
function duckPx(z) { return clamp(20 * z, 104, 140); }

function pieceStateFn(t) {
  const evByPiece = {};
  const gagByPiece = {};
  if (L.tl && (L.phase === 'flight' || L.phase === 'result' || L.phase === 'idle')) {
    for (const e of L.tl.events) if (e.data && e.data.piece) evByPiece[e.data.piece] = e;
    for (const g of L.tl.gags) if (g.data && g.data.piece) gagByPiece[g.data.piece] = g;
  }
  return pc => {
    const st = { time: S.time };
    if (pc.data && pc.data.drift && L.tl) { const tw = t + (L.phase === 'result' || L.phase === 'idle' ? S.time - (L.restAt || S.time) : 0); st.dx = driftX(pc, L.tl.seed, tw) - pc.x; st.lean = driftLean(pc, L.tl.seed, tw); }
    const e = evByPiece[pc.id];
    if (e && t >= e.t) {
      st.hit = t - e.t;
      if (pc.type === 'crate') st.opened = true;
      if (pc.type === 'booth') st.ring = t < e.tEnd;
      if (pc.type === 'pond') st.ripples = [{ x: e.x, k: clamp((t - e.t) / 1.2, 0, 1) }];
    }
    const g = gagByPiece[pc.id];
    if (g && t >= g.t - 0.3 && t < g.tEnd + 1.5) st.look = clamp((t - g.t + 0.3) / 0.4, 0, 1) * (t > g.tEnd + 1 ? clamp(1 - (t - g.tEnd - 1) / 0.5, 0, 1) : 1);
    return st;
  };
}

function drawLaunch(ctx, dt) {

/* ---------- landing flags + ghost lines ---------- */
function drawFieldMarks(ctx, V) {
  const R = S.race;
  L.curLabel = null;
  if (!R) return;
  const flagH = clamp(18 * V.z, 70, 120);
  const marks = [];
  for (const pl of R.players) {
    const r = R.results[pl.key];
    if (!r) continue;
    const isCur = L.pl && pl.key === L.pl.key && L.phase === 'result';
    marks.push({ x: r.dist, pl, rise: isCur ? easeBack(L.pt / 0.4) : 1, cur: L.pl && pl.key === L.pl.key });
  }
  marks.sort((a, b) => a.x - b.x);
  const lead = leaderEntry();
  // ghost lines: leader, last real race winner, all-time record
  const ghosts = [];
  if (lead && !(L.pl && lead.pl.key === L.pl.key && (L.phase === 'result' || L.phase === 'idle'))) ghosts.push({ x: lead.dist, label: 'LEADER', color: teamOf(lead.pl).color });

  if (R.record != null) ghosts.push({ x: R.record, label: 'RECORD', color: '#ffd23f' });
  ghosts.sort((a, b) => a.x - b.x);
  let lastSx = -1e9, stack = 0;
  for (const g of ghosts) {
    const sx = V.sx(g.x);
    if (sx < -50 || sx > 1970) continue;
    stack = sx - lastSx < 190 ? stack + 1 : 0; lastSx = sx;
    ctx.save();
    ctx.setLineDash([16, 12]); ctx.lineWidth = 5; ctx.strokeStyle = rgba(g.color === '#ffffff' ? '#ffffff' : g.color, 0.85);
    ctx.beginPath(); ctx.moveTo(sx, V.gy); ctx.lineTo(sx, V.gy - 330); ctx.stroke();
    ctx.setLineDash([]);
    const ly = V.gy - 330 - stack * 44;
    ctx.font = font(24);
    const w = ctx.measureText(g.label).width + 26;
    rr(ctx, sx - w / 2, ly - 34, w, 36, 12); fillStroke(ctx, g.color, 4);
    txt(ctx, g.label, sx, ly - 15, { px: 24, color: g.color === '#ffffff' || g.color === '#ffd23f' ? OUT : '#fff', sw: 0 });
    ctx.restore();
  }
  // flags: labels only where they fit
  let lastLabelRight = -1e9;
  const labeled = new Set();
  const order = marks.slice().sort((a, b) => (b.cur ? 1 : 0) - (a.cur ? 1 : 0) || b.x - a.x);
  const placed = [];
  for (const m of order) {
    const sx = V.sx(m.x);
    if (sx < -100 || sx > 2020) continue;
    const w = Math.min(340, m.pl.duck.name.length * 15 + 30);
    if (placed.every(p => Math.abs(p - sx) > (w + 20) * 0.75) && V.z > 0.9) { labeled.add(m); placed.push(sx); }
  }
  for (const m of marks) {
    const sx = V.sx(m.x), sy = V.sy(SIM.groundY(m.x));
    if (sx < -100 || sx > 2020) continue;
    const fh = m.cur ? Math.max(flagH, duckPx(V.z) * 1.35) : flagH;
    drawFlag(ctx, sx - (m.cur ? duckPx(V.z) * 0.12 : 0), sy + (1 - m.rise) * fh, fh * m.rise, teamOf(m.pl), labeled.has(m) ? m.pl.duck.name : null, { t: S.time, px: 26, maxW: 320 });
    if (m.cur && labeled.has(m)) L.curLabel = [sx - duckPx(V.z) * 0.12, sy + (1 - m.rise) * fh, fh * m.rise, teamOf(m.pl), m.pl.duck.name];
  }
}

/* ---------- cannon, duck, event actors ---------- */
function drawLaunchActors(ctx, V, t) {
  const pl = L.pl;
  if (!pl) return;
  const d = pl.duck;
  const px = duckPx(V.z);
  const ph = L.phase;
  const crewLean = L.fuseOut && L.phase === 'countdown' ? clamp((L.pt - (L.cdT || 3 * PACE()) - 0.6) / 0.8, 0, 1) : 0;
  const countdownT = L.cdT || 3 * PACE();
  const burn = ph === 'countdown' ? clamp(L.pt / countdownT, 0, L.fuseOut ? 0.82 : 1) : (ph === 'flight' || ph === 'result' || ph === 'idle') ? 1 : 0;
  let recoil = 0;
  if (ph === 'flight' && L.tl) { const tt = t - L.tl.launchT; recoil = tt >= 0 && tt < 0.6 ? Math.sin(clamp(tt / 0.6, 0, 1) * Math.PI) : 0; }
  const cannonSt = { angle: L.barrel, burn, lit: ph === 'countdown' && !(L.fuseOut && L.pt > countdownT * 2 / 3), recoil, t: S.time, crewLean, reach: ph === 'countdown' ? clamp(L.pt / 0.25, 0, 1) * clamp(1 - (L.pt - 0.35) / 0.3, 0, 1) : 0, smolder: ph === 'idle' || ph === 'intro', crewPose: crewLean > 0.5 ? 'scared' : 'stand' };
  const m = cannonMuzzle(L.barrel);
  const peekDuck = (nervous) => {
    const a = L.barrel * DEG;
    const sz = px * 0.78, u = sz / 95;
    const G = DUCK_GEO[d.legendary === 'goose' ? 'goose' : d.base] || DUCK_GEO.mallard;
    const jig = ph === 'countdown' ? Math.sin(S.time * 18) * 1.5 : 0;
    // rotate so the body points down the barrel and the head pokes out of the mouth
    const local = Math.atan2(-G.head[1], -G.head[0]);
    const rot = (Math.PI - a) - local;
    const out = G.head[2] * u * 1.15 + 6;
    ctx.save(); ctx.translate(V.sx(m.x) + Math.cos(a) * out, V.sy(m.y) - Math.sin(a) * out); ctx.rotate(rot);
    drawDuck(ctx, d, -G.head[0] * u + jig, -G.head[1] * u, sz, duckDrawOpts(pl, { pose: nervous ? 'peek' : 'stand' }));
    ctx.restore();
  };
  drawWaitingLine(ctx, V, t);
  if (ph === 'intro' || ph === 'ladder') {
    ART.cannon(ctx, V, cannonSt);
    const lad = ART.ladder(ctx, V, L.barrel);
    let x, y, flip = true, pose = 'stand', hide = false, rot = 0;
    const pace = PACE();
    // the next duck waddles over from the front of the line to the ladder

    else {

      else if (h < 1) { x = lerp(lad.tx + 2, m.x, h); y = lerp(lad.ty, m.y + 4, h) + Math.sin(h * Math.PI) * 10; pose = 'scared'; rot = -h * 2; }
      else hide = true;
    }
    if (!hide) drawDuck(ctx, d, V.sx(x), V.sy(y) - px * 0.45, px, duckDrawOpts(pl, { pose, flip, rot, flap: pose === 'scared' ? S.time * 3 : null }));
    else peekDuck(true);
    return;
  }
  if (ph === 'armed' || ph === 'countdown') {
    peekDuck(true);
    ART.cannon(ctx, V, cannonSt);
    ART.ladder(ctx, V, L.barrel);
    return;
  }
  // flight / result / idle
  ART.cannon(ctx, V, cannonSt);
  const tl = L.tl;
  if (!tl) return;
  const s = sampleTL(tl, t);
  // event actors behind the duck
  drawEventActors(ctx, V, t, s, px, true);
  // flying hat
  const ex = tl.extra || {};
  const hatGone = (tl.hat && t >= tl.hat.t0) || (ex.hatStolenT != null && t >= ex.hatStolenT);
  if (tl.hat && t >= tl.hat.t0) {
    const hi = clamp(Math.floor((t - tl.hat.t0) * 60), 0, tl.hat.n - 1);
    const hx = V.sx(tl.hat.x[hi]), hy = V.sy(tl.hat.y[hi]);
    const hatId = S.cond.friday ? 'party' : d.hat;
    if (hatId) drawHat(ctx, hatId, hx, hy - 6, px / 95 * 1.1, 5, S.time);
    if (tl.hat.wins && (L.phase === 'result' || L.phase === 'idle')) txt(ctx, 'HAT', hx, hy - 60, { px: 28, color: '#ffd23f' });
  }
  if (s.vis || L.phase !== 'flight') {
    const done = L.phase !== 'flight';
    let pose = done ? (L.result && (L.result.rank <= 3 || L.result.dist > 1500) ? 'smug' : (tl.events.some(e => ['mud', 'gatekeeper', 'tree', 'billboard', 'geese'].includes(e.id)) ? 'dizzy' : 'stand')) : (POSE_NAME[s.pose] || 'fly');
    if (done && tl.events.some(e => e.id === 'hammock')) pose = 'sleep';
    if (done && tl.events.some(e => e.id === 'plop')) pose = 'swim';
    if (done && tl.events.some(e => e.id === 'bread')) pose = 'eat';
    const gagWave = tl.gags.find(g => g.id === 'wave' && t >= g.t && t <= g.tEnd);
    if (gagWave) pose = 'wave';
    const inAir = s.mode === SIM.MODE.air;
    const flap = inAir && pose !== 'carried' && pose !== 'glide' ? S.time * (pose === 'scared' ? 4.5 : 3) : null;
    let rot = s.rot;
    if (pose === 'stand' || pose === 'smug' || pose === 'swim' || pose === 'eat' || pose === 'sleep' || done) rot = done ? 0 : s.rot;
    if (pose === 'fly' || pose === 'scared' || pose === 'rocket' || pose === 'carried' || pose === 'glide') { const va = Math.atan2(-s.vy, Math.max(20, Math.abs(s.vx))) * 0.6; rot = (pose === 'carried' || pose === 'glide') ? 0 : (Math.abs(s.rot) > 0.3 && pose !== 'rocket' ? s.rot : va); }

    const besideFlag = done ? px * 0.42 : 0;

    if (pose === 'swim') { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 1920, V.sy(SIM.groundY(s.x)) + 2); ctx.clip(); }

    if (pose === 'sleep' && done && fx.chance(0.02)) Particles.add({ type: 'zzz', ws: true, x: s.x + 4, y: s.y + 10, vx: 3, vy: 5, life: 2.2, px: 30 });
    L.duckScreen = { x: sx, y: sy - px * 0.3 };
  }
  drawEventActors(ctx, V, t, s, px, false);
}
// Today's next few ducks wait their turn on the hill behind the cannon (and hop when it fires)
function drawWaitingLine(ctx, V, t) {
  const R = S.race;
  if (!R || V.sx(-200) > 1920 || V.sx(-80) < -100) return;
  const ph = L.phase;
  const start = (ph === 'result' || ph === 'idle' || ph === 'loading') ? R.idx : R.idx + 1;
  const seen = new Set(L.pl ? [L.pl.key] : []), line = [];
  for (let i = start; i < R.queue.length && line.length < 4; i++) { const pl = R.players[R.queue[i].p]; if (!pl.out && !seen.has(pl.key)) { seen.add(pl.key); line.push(pl); } }
  if (!line.length) return;
  const sz = clamp(10 * V.z, 46, 72);
  const sinceBoom = L.tl && ph === 'flight' ? t - L.tl.launchT : 99;
  const cheer = (ph === 'result' && L.result && (L.result.newLeader || L.result.newRecord) && L.pt < 2) || (sinceBoom >= 0 && sinceBoom < 1.2);
  line.forEach((pl, i) => {
    const x = -88 - i * 17, gy = SIM.groundY(x);

const CV = document.getElementById('cv');
const CTX = CV.getContext('2d');
const STAGE = document.getElementById('stage');
let VIEW = { scale: 1, ox: 0, oy: 0, k: 1 };
// Adaptive quality: if frames run slow (weak laptop, busy screen share), render at a lower internal
// resolution and use fewer particles; step back up after a long smooth stretch.
// A probe guards against frame-rate caps (laptop battery saver runs at 30 fps however light the
// drawing is): if a step down doesn't actually speed frames up, it's undone and adaptation stops.
const QUAL = { k: 1, slow: 0, fast: 0, iv: [], probe: null, locked: false };
function medianIv() { const a = QUAL.iv.slice().sort((x, y) => x - y); return a.length ? a[a.length >> 1] : 1 / 60; }
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const scale = Math.min(w / 1920, h / 1080);
  const ox = (w - 1920 * scale) / 2, oy = (h - 1080 * scale) / 2;
  STAGE.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + scale + ')';
  const dpr = window.devicePixelRatio || 1;
  const k = Math.max(0.42, clamp(scale * dpr, 0.5, 1.25) * QUAL.k);
  const bw = Math.round(1920 * k), bh = Math.round(1080 * k);
  if (CV.width !== bw || CV.height !== bh) { CV.width = bw; CV.height = bh; }
  VIEW = { scale, ox, oy, k: bw / 1920 };
}
function toLogical(e) { return { x: (e.clientX - VIEW.ox) / VIEW.scale, y: (e.clientY - VIEW.oy) / VIEW.scale }; }
let audioPrimed = false;
function primeAudio() {
  if (audioPrimed) { SFX.resume(); return; }
  audioPrimed = true;
  SFX.init(); SFX.setVolume(S.settings.volume); SFX.setMuted(S.settings.muted); SFX.resume();

}

CV.addEventListener('pointerdown', e => { primeAudio(); const p = toLogical(e); const b = hitButton(p.x, p.y); S.pressed = b ? b.id : null; });
CV.addEventListener('pointerup', e => { const p = toLogical(e); const b = hitButton(p.x, p.y); if (b && b.id === S.pressed && b.fn) b.fn(); S.pressed = null; });
document.addEventListener('pointerdown', () => primeAudio(), { capture: true });
function typingTarget(e) {
  const t = e.target; if (!t) return false;
  const tag = (t.tagName || '').toLowerCase();
  if (tag === 'input') { const ty = (t.type || 'text').toLowerCase(); return !['checkbox', 'radio', 'button', 'submit', 'range', 'color', 'file'].includes(ty); }
  return tag === 'textarea' || tag === 'select' || t.isContentEditable;
}

  try {
    if (!document.fullscreenEnabled) { Toast.show('Fullscreen is blocked here. Open the page in its own tab, or use the browser menu.', 2800); return; }
    if (document.fullscreenElement) document.exitFullscreen();

window.addEventListener('keydown', e => {

  // a checkbox / button reached with the keyboard keeps Space for itself (after a mouse click, Space is the big button)
  if ((k === ' ' || e.code === 'Space') && e.target && e.target.closest && e.target.closest('#roster, #modal') && /^(input|button|select)$/i.test(e.target.tagName) && e.target.matches(':focus-visible')) return;

  if (k === 'f') { toggleFullscreen(); return; }
  if (k === 'm') { primeAudio(); S.settings.muted = !S.settings.muted; SFX.setMuted(S.settings.muted); if (S.settings.muted) Voice.stop(); saveSettings(); Toast.show(S.settings.muted ? 'Muted' : 'Sound on'); return; }
  if (k === 'p') { openSettings(S.screen === 'launch' && !!S.race); return; }

  if (k === 't') { S.turbo = S.race ? !S.turbo : !S.settings.turboDefault; if (S.race) { S.race.turbo = S.turbo; saveRace(); } else { S.settings.turboDefault = S.turbo; saveSettings(); if (S.screen === 'roster') Roster.render(); } Toast.show(S.turbo ? 'Turbo ON (2x)' : 'Turbo off'); if (S.screen === 'launch' && L.phase === 'flight' && L.tl && L.pb) replanFlight(); return; }

});

  Iris.draw(ctx);
  if (S.paused) { ctx.fillStyle = 'rgba(31,26,46,0.3)'; ctx.fillRect(0, 0, 1920, 1080); }
}
let lastNow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = lastNow ? (now - lastNow) / 1000 : 1 / 60;
  lastNow = now;
  const dt = Math.min(0.05, Math.max(0, raw));
  if (raw > 0) S.fps = lerp(S.fps, 1 / Math.max(raw, 0.001), 0.05);
  if (raw > 0 && raw < 0.4 && !document.hidden) {
    QUAL.iv.push(raw); if (QUAL.iv.length > 90) QUAL.iv.shift();
    const setK = k => { QUAL.k = k; QUAL.slow = 0; QUAL.fast = 0; Particles.max = QUAL.k < 0.8 ? 150 : 260; resize(); };
    if (QUAL.probe && S.rt - QUAL.probe.at > 3) {
      // did the lower resolution help? if not, the frame rate is capped, not overloaded: put it back
      if (medianIv() > QUAL.probe.m * 0.9) { QUAL.locked = true; setK(QUAL.probe.k); }
      QUAL.probe = null;
    }
    if (raw > 1 / 40) QUAL.slow += raw; else QUAL.slow = Math.max(0, QUAL.slow - raw * 0.5);
    QUAL.fast = raw < 1 / 54 ? QUAL.fast + raw : 0;
    if (!QUAL.probe && !QUAL.locked && QUAL.slow > 1.5 && QUAL.k > 0.7) { QUAL.probe = { k: QUAL.k, m: medianIv(), at: S.rt }; QUAL.iv = []; setK(Math.max(0.7, QUAL.k - 0.15)); }
    else if (QUAL.fast > 25 && QUAL.k < 1) setK(Math.min(1, QUAL.k + 0.15));
  }
  // pause freezes everything the audience sees: the show, captions (their clock, S.rt, stops too) and screen wipes
  if (!S.paused) S.rt += dt;
  if (!S.paused) { S.time += dt; try { update(dt); } catch (err) { console.error(err); } Particles.update(dt); Shake.update(dt); Caps.update(); Iris.update(dt); }
  try { draw(dt); } catch (err) { console.error(err); }
  if (S.debugOn && (Math.floor(S.rt * 4) !== Math.floor((S.rt - dt) * 4))) DebugPanel.tick();
}

/* ---------- console API ---------- */
const DDB = {
  balance(n, opts) { const r = runBalance(n || 10000, opts); console.log(printBalance(r)); console.table(r.events); return r; },
  selfTest() { const r = runSelfTest(); console.log((r.ok ? 'SELF TEST PASSED' : 'SELF TEST FAILED') + '\n' + r.checks.join('\n')); return r; },
  sim, generateDuck, dailyConditions, generateCourse, state: S, store: Store,
};
window.DDB = DDB;

function boot() {
  resize();
  SFX.setVolume(S.settings.volume);
  refreshWorld(true);
  if (S.debugOn) DebugPanel.build();
  const c = savedShow();
  if (S.galleryOn) go('gallery');
  else go('title');
  if (c && !S.galleryOn) Toast.show(c.day === todayKey() ? "Today's show is still going: press the big red button to resume." : 'There is an unfinished show from ' + shortDate(c.day) + '. Press START for a new one, or resume it from the button on the right.', 3600);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && (S.screen === 'title' || S.screen === 'roster') && !S.race) { const before = S.day; checkDayRollover(); if (S.day !== before && S.screen === 'title') go('title'); if (S.day !== before && S.screen === 'roster') Roster.render(); } });
  requestAnimationFrame(frame);
}
boot();

</script>
