  #roster .row { display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 12px; font-size: 26px; font-weight: 800; }
  #roster .row:nth-child(odd) { background: #f6f1e3; }
  #roster .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 26px; font-weight: 800; border: 3px solid transparent; background: transparent; padding: 2px 6px; border-radius: 10px; }
  #roster .row .nm:hover { border-color: #d9cfb8; background: #fff; }
  #roster .row .nm:focus { border-color: var(--ink); background: #fff; outline: none; }
  #roster .row:not(.on) .nm { opacity: .55; }
  #roster .stale { background: #ffe58a; border: 4px solid var(--ink); border-radius: 16px; padding: 6px 14px; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 12px; }

  #roster .total { font-size: 30px; font-weight: 900; }
  #roster .warn { color: #b0392b; font-size: 20px; font-weight: 900; min-height: 24px; }

  #modal { position: absolute; inset: 0; background: rgba(20,18,28,.55); display: flex; align-items: center; justify-content: center; }
  #modal .panel { width: 1240px; max-height: 960px; overflow-y: auto; padding: 26px 32px; display: flex; flex-direction: column; gap: 16px; }
  #modal h2 { margin: 0; font-size: 46px; }
  #modal h3 { margin: 6px 0 0; font-size: 26px; }
  #modal .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; }
  #modal .field { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; }
  #modal .swatches { display: flex; gap: 6px; }
  #modal .sw { width: 34px; height: 34px; border-radius: 10px; border: 3px solid var(--ink); cursor: pointer; }
  #modal .sw.on { outline: 4px solid #000; outline-offset: 2px; }
  #modal input[type=range] { width: 260px; accent-color: #e8412c; }
  #modal .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #modal textarea.out { width: 100%; height: 360px; font-size: 18px; font-family: ui-monospace, Consolas, monospace; }
  #modal .note { font-size: 18px; font-weight: 700; opacity: .75; }

  #toast { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 26px; font-weight: 900; padding: 10px 22px; border-radius: 16px; pointer-events: none; transition: opacity .3s; opacity: 0; width: max-content; max-width: 1700px; white-space: normal; text-align: center; }
  #toast.on { opacity: 1; }
  details.rmbox { margin: 14px 0 4px; } details.rmbox summary { cursor: pointer; font-weight: 900; font-size: 24px; }

  /* ---------- debug ---------- */
  #debug { position: fixed; right: 8px; top: 8px; width: 330px; max-height: calc(100vh - 16px); overflow-y: auto; z-index: 50; background: rgba(255,248,230,.96); border: 3px solid var(--ink); border-radius: 14px; padding: 10px; font: 700 13px/1.35 system-ui, sans-serif; color: var(--ink); }
  #debug h4 { margin: 4px 0; font-size: 15px; }
  #debug .r { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
  #debug input, #debug select { font: 700 13px system-ui, sans-serif; border-width: 2px; border-radius: 6px; padding: 2px 4px; }
  #debug button { font: 800 12px system-ui, sans-serif; border: 2px solid var(--ink); border-radius: 6px; background: #ffd84d; cursor: pointer; padding: 3px 7px; }

<script>
'use strict';
/* =====================================================================
   Duck Duck BOOM!  ·  one-file browser game
   Sections:  RNG · CONTENT · STORAGE · DUCKS · WORLD (conditions+course)

/* =========================== RNG ===================================== */
// Seeded randomness only. Math.random is never used anywhere in this file.

function hashStr(str) {
  // cyrb53-style 53-bit hash folded to 32 bits
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 ^ Math.imul(h2, 0x9E3779B1)) >>> 0;
}
// hash(a, b, c...) -> uint32. Numbers and strings both allowed.
function hash(...parts) {
  return hashStr(parts.map(p => (typeof p === 'number' ? 'n' + (p >>> 0).toString(16) : 's' + String(p))).join('␟'));
}
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function sfc32(a, b, c, d) {
  return function () {
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}
class Rng {
  constructor(seed) {
    const m = mulberry32(seed >>> 0);
    const u = () => Math.floor(m() * 4294967296) >>> 0;
    this.f = sfc32(u(), u(), u(), u());
    for (let i = 0; i < 12; i++) this.f();
  }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return a + Math.floor(this.f() * (b - a + 1)); }
  chance(p) { return this.f() < p; }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  sign() { return this.f() < 0.5 ? -1 : 1; }
  weighted(items, wf) {
    let tot = 0;
    for (const it of items) tot += Math.max(0, wf(it));
    let r = this.f() * tot;
    for (const it of items) { r -= Math.max(0, wf(it)); if (r < 0) return it; }
    return items[items.length - 1];
  }
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

/* ---------- small math + misc helpers ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

const DOW3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* =========================== STORAGE ================================= */
// Every key is prefixed ddb.v1. and wrapped as {schema, data}. localStorage.clear() is never called,
// because every site on a github.io account shares one storage origin. A blocked store falls back to memory.

const Store = (() => {
  const PREFIX = 'ddb.v1.';
  const SCHEMA = 1;
  const KEYS = ['settings', 'roster', 'history', 'current', 'rerolls', 'recentNames'];
  const mem = Object.create(null);
  let ls = null;
  let full = false;
  const isQuota = e => e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);
  try {
    const t = window.localStorage;
    t.getItem(PREFIX + 'settings');
    try { t.setItem(PREFIX + '__probe', '1'); t.removeItem(PREFIX + '__probe'); }
    catch (e) { if (isQuota(e)) full = true; else throw e; } // full but readable: keep reading what's saved
    ls = t;
  } catch (e) { ls = null; }
  let warned = false;
  function failed() {
    full = true;
    if (!warned && typeof Toast !== 'undefined') { warned = true; setTimeout(() => Toast.show('Browser storage is full, so changes are not being saved. Export your data (Settings), then clear some site data.', 6000), 0); }
  }

  // this session's copy wins: set() always writes mem first, so a save that failed (storage full) is still what we read and export
  function readRaw(key) {
    if (mem[key] != null) return mem[key];
    if (ls) { try { const v = ls.getItem(PREFIX + key); if (v != null) { mem[key] = v; return v; } } catch (e) { /* fall through */ } }
    return null;
  }
  function get(key, fallback) {
    try {
      const raw = readRaw(key);
      if (raw == null) return fallback;
      const v = JSON.parse(raw);
      if (!v || typeof v !== 'object' || !('data' in v)) return fallback;
      if (v.schema !== SCHEMA) return migrate(key, v, fallback);
      return v.data == null ? fallback : v.data;
    } catch (e) { return fallback; }
  }
  function migrate(key, v, fallback) {
    // Only schema 1 exists so far. Future versions upgrade here.
    return fallback;
  }
  function set(key, data) {
    let raw;
    try { raw = JSON.stringify({ schema: SCHEMA, data }); } catch (e) { return false; }
    mem[key] = raw;
    if (!ls) return true;
    try { ls.setItem(PREFIX + key, raw); return true; } catch (e) {
      // probably quota: trim history and retry once
      if (key === 'history' && data && Array.isArray(data.races) && data.races.length > 30) {
        data.races = data.races.slice(-Math.floor(data.races.length * 0.7));
        try { const r2 = JSON.stringify({ schema: SCHEMA, data }); ls.setItem(PREFIX + key, r2); mem[key] = r2; return true; } catch (e2) { /* ignore */ }
      }
      failed();
      return false;
    }
  }
  function del(key) {
    delete mem[key];
    if (ls) { try { ls.removeItem(PREFIX + key); } catch (e) { /* ignore */ } }
  }
  function wipe() {
    // remove only our own keys
    for (const k of KEYS) del(k);
    if (ls) {
      try {
        const doomed = [];
        for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.indexOf(PREFIX) === 0) doomed.push(k); }
        doomed.forEach(k => ls.removeItem(k));
      } catch (e) { /* ignore */ }
    }
  }
  function exportAll() {
    const out = { app: 'duck-duck-boom', schema: SCHEMA, exportedAt: new Date().toString(), data: {} };
    for (const k of KEYS) { const v = get(k, null); if (v != null) out.data[k] = v; }
    return out;
  }
  function importAll(obj, dryRun) {
    if (!obj || typeof obj !== 'object' || obj.app !== 'duck-duck-boom' || !obj.data || typeof obj.data !== 'object') throw new Error('Not a Duck Duck BOOM! backup file.');
    if (obj.schema !== SCHEMA) throw new Error('Backup is from an unknown version (' + obj.schema + ').');
    const D = obj.data, isObj = v => v && typeof v === 'object' && !Array.isArray(v);
    const valid = {
      settings: isObj, rerolls: isObj, recentNames: isObj,
      roster: v => isObj(v) && Array.isArray(v.people),
      history: v => isObj(v) && Array.isArray(v.races),
      current: v => isObj(v) && Array.isArray(v.players) && Array.isArray(v.queue) && v.players.every(p => p && p.duck && p.name) && v.queue.every(q => q && v.players[q.p]),
    };
    const bad = KEYS.filter(k => k in D && D[k] != null && !valid[k](D[k]));
    if (bad.length) throw new Error('The backup looks damaged (' + bad.join(', ') + ').');
    if (dryRun) return 0;
    // a backup is a full restore: our keys that aren't in it are cleared
    let n = 0;
    for (const k of KEYS) { if (k in D && D[k] != null) { set(k, D[k]); n++; } else del(k); }
    return n;
  }
  return { get, set, del, wipe, exportAll, importAll, persistent: !!ls, get full() { return full; }, SCHEMA, PREFIX };
})();

  return { teams: deepClone(C.TEAM_DEFAULTS), volume: 0.6, muted: false, shake: true, voice: false, turboDefault: false, autoAdvance: false, practice: false, bonusAmmo: false };
}
function loadSettings() {
  const s = Object.assign(defaultSettings(), Store.get('settings', {}) || {});
  if (!Array.isArray(s.teams) || s.teams.length !== 3) s.teams = deepClone(C.TEAM_DEFAULTS);
  s.teams = s.teams.map((t, i) => ({ name: cleanName(t && t.name) || C.TEAM_DEFAULTS[i].name, color: (t && /^#[0-9a-f]{6}$/i.test(t.color)) ? t.color : C.TEAM_DEFAULTS[i].color, shape: C.TEAM_DEFAULTS[i].shape }));
  s.volume = clamp(+s.volume || 0, 0, 1);

  return s;
}
function saveSettings() { Store.set('settings', S.settings); }

function loadRoster() {
  const r = Store.get('roster', null);
  const people = (r && Array.isArray(r.people)) ? r.people : [];
  const day = r && typeof r.day === 'string' ? r.day : null;
  // td = the day this person was ticked (older saves only have the roster-wide day)
  return people.filter(p => p && p.name).map(p => ({ id: p.id || ('p' + hex8(hash(p.name, p.team || 0))), name: cleanName(p.name), team: clamp(p.team | 0, 0, 2), checked: !!p.checked, ammo: clamp(p.ammo | 0, 0, 3), td: p.checked ? (typeof p.td === 'string' ? p.td : day) : null }));
}
// ticksChanged: only deliberate tick edits move the 'ticks are from <day>' date forward
function saveRoster(ticksChanged) {

  const prev = rosterDay();
  Store.set('roster', { people: S.roster, day: ticksChanged || !prev ? localDayKey() : prev });
}
// the local date the ticks were last changed (to nudge the host to clear yesterday's ticks)
function rosterDay() { const r = Store.get('roster', null); return r && typeof r.day === 'string' ? r.day : null; }

function loadHistory() {

function loadRerolls(dayKey) {

}
function saveRerolls(dayKey, counts) { Store.set('rerolls', { date: dayKey, counts }); }

// Duck names used on earlier days (today's are excluded so a reload regenerates identical ducks)
function recentNameSet(dayKey) {
  const r = Store.get('recentNames', null);
  const set = new Set();
  if (r && r.byDate && typeof r.byDate === 'object') {
    for (const d of Object.keys(r.byDate)) if (d < dayKey && Array.isArray(r.byDate[d])) r.byDate[d].forEach(n => set.add(n));
  }

}
function rememberNames(dayKey, names) {

  const by = (r.byDate && typeof r.byDate === 'object') ? r.byDate : {};
  const cur = new Set(by[dayKey] || []);

/* ---------- Waddle of Fame (all derived from saved history) ---------- */
function lastRealRace(races) { return races.length ? races[races.length - 1] : null; }
function allTimeRecord(races) {
  let best = null;
  for (const r of races) for (const e of r.res) if (!best || e.dist > best.dist) best = { dist: e.dist, p: e.p, d: e.d, date: r.date };
  return best;
}
function computeFame(races, todayKey) {
  const players = new Map();
  const teams = new Map();
  const launches = [];
  const month = (todayKey || localDayKey()).slice(0, 7);
  const monthly = new Map();
  let monthBest = null;
  const legend = [];
  for (const r of races) {
    const sorted = r.res.slice().sort((a, b) => b.dist - a.dist);
    sorted.forEach((e, i) => {
      const k = personKey(e.p);
      if (!players.has(k)) players.set(k, { name: e.p, wins: 0, races: 0, podiums: 0, best: -1e9 });
      const P = players.get(k);
      P.name = e.p; P.races++; if (i === 0) P.wins++; if (i < 3) P.podiums++; P.best = Math.max(P.best, e.dist);
      launches.push({ dist: e.dist, p: e.p, d: e.d, date: r.date });
      if (r.date && r.date.slice(0, 7) === month) {
        if (!monthly.has(k)) monthly.set(k, { name: e.p, pts: 0, wins: 0 });
        const M = monthly.get(k);
        M.pts += [3, 2, 1][i] || 0;
        if (i === 0) M.wins++;
        if (!monthBest || e.dist > monthBest.dist) monthBest = { dist: e.dist, p: e.p, d: e.d, date: r.date };
      }
    });
    if (sorted[0]) {
      // by team slot, so renaming a team in Settings keeps its wins
      const ti = clamp(sorted[0].t | 0, 0, 2);
      teams.set(ti, (teams.get(ti) || 0) + 1);
    }
    (r.legend || []).forEach(L => legend.push(Object.assign({ date: r.date }, L)));
  }
  // current streak: consecutive most-recent races won by the same person
  let streak = null;
  for (let i = races.length - 1; i >= 0; i--) {
    if (races[i].res.length < 2) continue;   // a solo run isn't a win over anyone
    const w = races[i].res.slice().sort((a, b) => b.dist - a.dist)[0];
    if (!w) break;
    if (!streak) streak = { name: w.p, n: 1, key: personKey(w.p) };
    else if (personKey(w.p) === streak.key) streak.n++;
    else break;
  }
  launches.sort((a, b) => b.dist - a.dist);
  return {
    races: races.length,
    players: Array.from(players.values()).sort((a, b) => b.wins - a.wins || b.podiums - a.podiums || b.best - a.best),
    teams: Array.from(teams.entries()).map(([i, wins]) => ({ i, wins })).sort((a, b) => b.wins - a.wins),
    top10: launches.slice(0, 10),
    monthly: Array.from(monthly.values()).sort((a, b) => b.pts - a.pts || b.wins - a.wins),
    monthBest,
    streak,
    legend: legend.slice(-14).reverse(),
  };
}


/* =========================== DUCKS =================================== */
// A duck is pure cosmetics. Nothing here is ever read by the simulation.

const Blocklist = (() => {
  const r13 = s => s.replace(/[a-z]/gi, ch => { const b = ch <= 'Z' ? 65 : 97; return String.fromCharCode((ch.charCodeAt(0) - b + 13) % 26 + b); });
  const inside = C.BLOCK_INSIDE_R13.map(r13);
  const whole = new Set(C.BLOCK_WHOLE_R13.map(r13));
  const phrases = C.BLOCK_PHRASES_R13.map(r13);
  function words(text) {
    return String(text || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/).filter(Boolean);
  }
  function hit(text) {
    const w = words(text);
    for (const x of w) if (whole.has(x)) return true;
    const squashed = w.join('');
    for (const b of inside) if (squashed.indexOf(b) >= 0) return true;
    const spaced = ' ' + w.join(' ') + ' ';
    for (const p of phrases) if (spaced.indexOf(' ' + p + ' ') >= 0) return true;
    return false;
  }
  return { hit, words };
})();

const RARITY_INDEX = { common: 0, uncommon: 1, rare: 2, epic: 3, legendary: 4 };

function rollRarity(rng, forced) {
  if (forced) return forced;
  let r = rng.next();
  for (const R of C.RARITIES) { if (r < R.p) return R.id; r -= R.p; }
  return 'common';
}

// ctx: { recent:Set, taken:Set, firsts:Set(lowercase roster first names) }
const TITLE_WORDS = new Set(C.TITLES.concat(['the', 'of', 'von', 'de', 'la']).join(' ').toLowerCase().split(' '));
// the distinctive words of a name (so two ducks in one show don't share a 'Breadcrumbs')
function nameWords(name) { return Blocklist.words(name).filter(w => w.length >= 5 && !TITLE_WORDS.has(w)); }
function nameIsOk(name, ctx, strict) {
  if (!name || Blocklist.hit(name)) return false;
  if (strict) {
    if (name.length > 32) return false;
    if (ctx.takenWords && nameWords(name).some(w => ctx.takenWords.has(w))) return false;
  }
  if (ctx.recent && ctx.recent.has(name)) return false;
  if (ctx.taken && ctx.taken.has(name)) return false;
  if (ctx.firsts && ctx.firsts.size) {
    for (const w of Blocklist.words(name)) if (ctx.firsts.has(w)) return false;
  }
  return true;
}
function templateName(rng) {
  const T = () => rng.pick(C.TITLES), F = () => rng.pick(C.FIRSTS), Sn = () => rng.pick(C.SURNAMES), X = () => rng.pick(C.SUFFIXES);
  const r = rng.next();
  if (r < 0.24) return T() + ' ' + F() + ' ' + Sn();
  if (r < 0.44) return T() + ' ' + Sn();
  if (r < 0.62) return F() + ' ' + Sn();
  if (r < 0.72) return F() + ' ' + Sn() + ' ' + X();
  if (r < 0.82) return T() + ' ' + F();
  if (r < 0.88) return T() + ' ' + F() + ' ' + Sn() + ' ' + X();
  return F() + ' ' + X();
}
function genDuckName(rng, ctx, legendary) {
  for (let i = 0; i < 80; i++) {
    let n;
    if (legendary) {
      const L = C.LEGENDARIES.find(l => l.id === legendary);
      if (L.fixedName) n = i === 0 ? L.fixedName : L.fixedName + ' ' + ['II', 'III', 'IV', 'V', 'Jr.'][Math.min(4, i - 1)];
      else { const pre = rng.pick(C.LEGEND_NAME_PREFIX[legendary]); n = pre.endsWith('-') ? pre + rng.pick(C.FIRSTS) : pre + ' ' + (rng.chance(0.5) ? rng.pick(C.FIRSTS) : rng.pick(C.SURNAMES)); }
    } else n = rng.chance(0.24) ? rng.pick(C.ONE_OFFS) : templateName(rng);
    if (nameIsOk(n, ctx, i < 50 && !(legendary && i === 0))) return n;
  }
  // practically unreachable: deterministic, safe fallback
  return 'Duck No. ' + rng.int(100, 999);
}
function genStats(rng) {
  const cats = rng.shuffle(C.STATS).slice(0, 3);
  return cats.map(c => {
    let v = rng.pick(c.v);
    v = v.replace('{n}', String(rng.int(2, 97)));
    return { k: c.k, v };
  });
}
const QUACK_PITCH = { mallard: [0.9, 1.2], rubber: [1.5, 1.9], duckling: [1.35, 1.7], farm: [0.7, 0.95], carolina: [1.0, 1.3] };

// Generate a duck. seed = hash(dayKey, personKey, rerolls). opts: {forceRarity, ctx}
function generateDuck(seed, opts) {
  opts = opts || {};
  const rng = new Rng(seed);
  const rarity = rollRarity(rng, opts.forceRarity);
  const ri = RARITY_INDEX[rarity];
  const d = { seed: seed >>> 0, rarity, legendary: null };
  // parts are always drawn in the same order so the look is stable
  d.base = rng.pick(C.BASES).id;
  d.color = rng.int(0, C.COLORS.length - 1);
  d.color2 = (d.color + rng.int(3, C.COLORS.length - 3)) % C.COLORS.length;
  const patRoll = rng.next();
  d.pattern = ri === 0 ? (patRoll < 0.5 ? 'solid' : C.PATTERNS[1 + Math.floor(patRoll * 2 * 5) % 5]) : C.PATTERNS[1 + Math.floor(patRoll * 5)];
  const hatRoll = rng.next();
  d.hat = (ri >= 1 || hatRoll < 0.72) ? rng.pick(C.HATS) : null;
  const accs = rng.shuffle(C.ACCS);
  const nAcc = [rng.chance(0.6) ? 1 : 0, 1, 2, 2, 2][ri];
  // keep combos sane: one face item, one neck item
  const FACE = ['sunglasses', 'monocle', 'goggles'], NECK = ['bowtie', 'necktie', 'scarf', 'medal', 'lanyard'], EARS = ['headphones', 'headset'];
  const chosen = [];
  for (const a of accs) {
    if (chosen.length >= nAcc) break;
    const clash = g => g.includes(a) && chosen.some(c => g.includes(c));
    if (clash(FACE) || clash(NECK) || clash(EARS)) continue;
    if (d.hat === 'astro' && (FACE.includes(a) || EARS.includes(a))) continue;
    chosen.push(a);
  }
  d.acc = chosen;
  const eyePool = ri >= 2 ? C.EYES : ['normal', 'normal', 'sleepy', 'googly', 'determined', 'side', 'tiny'];
  d.eyes = rng.pick(eyePool);
  d.shimmer = ri >= 3;
  if (rarity === 'legendary') { d.legendary = rng.pick(C.LEGENDARIES).id; if (d.legendary === 'robo' || d.legendary === 'ghost' || d.legendary === 'pixel' || d.legendary === 'goose') d.acc = d.acc.filter(a => !['sunglasses', 'monocle', 'goggles', 'mustache'].includes(a)); }
  const pr = QUACK_PITCH[d.base] || [1, 1.2];
  d.pitch = d.legendary === 'goose' ? 0.55 : rng.range(pr[0], pr[1]);
  // text
  const ctx = opts.ctx || {};
  d.name = genDuckName(rng, ctx, d.legendary);
  let bio = rng.pick(C.BIOS);
  for (let i = 0; i < 5 && Blocklist.hit(bio); i++) bio = rng.pick(C.BIOS);
  d.bio = bio;
  d.stats = genStats(rng);
  if (d.legendary === 'goose') d.bio = 'Is a duck. Definitely. Please stop asking.';
  return d;
}
function duckSeed(dayKey, name, rerolls) { return hash('duck', dayKey, personKey(name), rerolls | 0); }
function duckDescription(d) {
  if (d.legendary) return C.LEGENDARIES.find(l => l.id === d.legendary).name;
  return C.COLORS[d.color].name + ' ' + C.BASES.find(b => b.id === d.base).name;
}


/* =========================== WORLD: conditions + course ============== */
// Seeded by the local date, so every duck on a given day gets the same conditions and course.

function thanksgivingDay(year) {
  const d = new Date(year, 10, 1);
  const firstThu = 1 + ((4 - d.getDay() + 7) % 7);
  return firstThu + 21;
}
function seasonFor(dayKey) {
  const d = parseDayKey(dayKey);
  const m = d.getMonth(), day = d.getDate();
  if (m === 10) { const t = thanksgivingDay(d.getFullYear()); if (day >= t - 3 && day <= t + 3) return 'harvest'; }
  if (m === 9) return 'pumpkin';
  if (m === 8 || m === 10) return 'autumn';
  if (m === 11 || m === 0 || m === 1) return 'winter';
  if (m >= 2 && m <= 4) return 'spring';
  return 'summer';
}
function seasonFlags(season) {
  return {
    autumn: season === 'autumn' || season === 'pumpkin' || season === 'harvest',
    leaves: season === 'autumn' || season === 'pumpkin' || season === 'harvest',
    pumpkins: season === 'pumpkin',
    turkey: season === 'harvest',
    snow: season === 'winter',
    lights: season === 'winter',
    flowers: season === 'spring',
    rain: season === 'spring',
    beach: season === 'summer',
  };
}

// ov (debug overrides): {wind:'calm'|'tail'|'head', mph, sky, mod, season, friday:true|false}
function dailyConditions(dayKey, ov) {
  ov = ov || {};
  const rng = new Rng(hash('conditions', dayKey));
  const d = parseDayKey(dayKey);
  const wr = rng.next();
  let windKind = wr < 0.28 ? 'calm' : wr < 0.64 ? 'tail' : 'head';
  let mph = windKind === 'calm' ? rng.int(0, 3) : rng.int(4, 20);
  let sky = rng.weighted(C.SKIES, s => s.w).id;
  const modRoll = rng.next();
  let mod = modRoll < 0.5 ? 'standard' : C.MODIFIERS[1 + Math.floor(rng.next() * (C.MODIFIERS.length - 1))].id;
  if (modRoll < 0.5) rng.next(); // keep stream aligned either way
  let season = seasonFor(dayKey);
  if (season === 'spring' && sky === 'sunny' && rng.chance(0.35)) sky = 'drizzle';
  let friday = d.getDay() === 5;
  if (ov.wind) { windKind = ov.wind; if (windKind === 'calm') mph = 0; else if (!ov.mph) mph = Math.max(mph, 12); }
  if (ov.mph != null && ov.mph !== '') mph = clamp(+ov.mph, 0, 20);
  if (ov.sky) sky = ov.sky;
  if (ov.mod) mod = ov.mod;
  if (ov.season) season = ov.season;
  if (ov.friday != null) friday = !!ov.friday;
  const fps = (windKind === 'calm' ? 0 : windKind === 'tail' ? 1 : -1) * mph * 1.4667;
  return { dayKey, wind: { kind: windKind, mph, fps }, sky, mod, season, friday, flags: seasonFlags(season) };
}
function conditionsSummary(cond) {
  const w = cond.wind.kind === 'calm' ? 'Calm' : (cond.wind.kind === 'tail' ? 'Tailwind ' : 'Headwind ') + cond.wind.mph + ' mph';
  const sky = C.SKIES.find(s => s.id === cond.sky).name;
  const mod = C.MODIFIERS.find(m => m.id === cond.mod).name;
  return w + ' · ' + sky + ' · ' + mod + (cond.friday ? ' · Fri-Yay!' : '');
}
function modName(cond) { return C.MODIFIERS.find(m => m.id === cond.mod).name; }

/* ---------- the course ----------
   Pieces: {id, ev, art, x, w, h, y?, chance, data}. Ground pieces sit on y=0; air pieces float at y.  */
const PIECE_DEFS = {
  trampoline: { ev: 'trampoline', w: [48, 58], h: 9, chance: 0.85, weight: 9 },
  castle: { ev: 'castle', w: [62, 74], h: 40, chance: 0.75, weight: 5 },
  bell: { ev: 'bell', w: [22, 22], h: 96, chance: 0.7, weight: 6 },
  banana: { ev: 'banana', w: [40, 52], h: 4, chance: 0.85, weight: 6 },
  tree: { ev: 'tree', w: [60, 74], h: 82, chance: 0.7, weight: 9 },
  clothesline: { ev: 'clothesline', w: [90, 110], h: 34, chance: 0.75, weight: 6 },
  mud: { ev: 'mud', w: [70, 90], h: 3, chance: 0.75, weight: 7 },
  hammock: { ev: 'hammock', w: [60, 66], h: 20, chance: 0.8, weight: 5 },
  billboard: { ev: 'billboard', w: [78, 86], h: 92, chance: 0.8, weight: 6 },
  booth: { ev: 'onhold', w: [24, 24], h: 40, chance: 0.6, weight: 4 },
  desk: { ev: 'gatekeeper', w: [46, 50], h: 30, chance: 0.6, weight: 4 },
  bumpers: { ev: 'pinball', w: [130, 150], h: 70, chance: 0.75, weight: 4 },
};
// Built courses, one per day and set of conditions: {course, job}. job is the unfinished test-flying, if any.
const COURSES = new Map();
// lazy: for screens that only draw the field (title, roster). They get the course as it stands, marked rough, and the
// test flights are finished in small slices by courseWork(). Anything that flies ducks asks without lazy and gets the
// finished course (the job is completed on the spot if it has to be). The result is the same either way.
function generateCourse(dayKey, cond, lazy) {
  const key = dayKey + JSON.stringify([cond.wind, cond.sky, cond.mod, cond.season, cond.friday]);
  let ent = COURSES.get(key);
  if (!ent) { if (COURSES.size > 500) COURSES.clear(); const course = buildCourse(dayKey, cond); ent = { course, job: balanceSteps(course, cond) }; COURSES.set(key, ent); }
  if (ent.job && !lazy) { try { while (!ent.job.next().done); } catch (e) { COURSES.delete(key); throw e; } ent.job = null; }   // a failed job is never mistaken for a finished one
  const out = { dayKey: ent.course.dayKey, pieces: ent.course.pieces.map(p => Object.assign({}, p, { data: Object.assign({}, p.data) })) };
  if (ent.job) out.rough = true;
  return out;
}
// Carry on any unfinished course test flights for about ms milliseconds. True while there is still work left.
function courseWork(ms) {
  const t0 = performance.now();
  for (const ent of COURSES.values()) {
    try { while (ent.job && performance.now() - t0 < ms) if (ent.job.next().done) ent.job = null; } catch (e) { COURSES.clear(); throw e; }
    if (ent.job) return true;
  }
  return false;
}
function buildCourse(dayKey, cond) {
  const rng = new Rng(hash('course', dayKey));
  const pieces = [];
  let uid = 0;
  const add = (type, x, extra) => {
    const def = PIECE_DEFS[type] || {};
    const w = extra && extra.w != null ? extra.w : rng.range(def.w[0], def.w[1]);
    const p = Object.assign({ id: type + (uid++), type, ev: def.ev || type, x: Math.round(x), w: Math.round(w), h: def.h || 0, y: 0, chance: def.chance || 0.5, data: {} }, extra || {});
    p.chance = clamp(p.chance * rng.range(0.85, 1.12), 0.05, 0.98);
    pieces.push(p);
    return p;
  };
  // fixed features first (positions), then fill the gaps with weighted ground pieces
  const fixed = [];
  const ponds = rng.chance(0.3) ? 0 : rng.chance(0.2) ? 2 : 1;
  for (let i = 0; i < ponds; i++) fixed.push({ type: 'pond', x: rng.range(i ? 1500 : 500, i ? 2600 : 1400), w: rng.range(130, 190) });
  fixed.push({ type: 'walkway', x: rng.range(700, 2200), w: rng.range(200, 260) });
  fixed.push({ type: 'bench', x: rng.range(450, 1800), w: 46 });
  if (rng.chance(0.5)) fixed.push({ type: 'bench', x: rng.range(1900, 3200), w: 46 });
  fixed.push({ type: 'minicannon', x: rng.range(900, 2300), w: 46 });
  fixed.push({ type: 'cows', x: rng.range(300, 2000), w: 220 });
  fixed.sort((a, b) => a.x - b.x);
  const occupied = [];
  const free = (x0, x1) => occupied.every(o => x1 + 30 < o[0] || x0 - 30 > o[1]);
  for (const f of fixed) {
    let x = f.x;
    for (let k = 0; k < 8 && !free(x, x + f.w); k++) x += 120;
    occupied.push([x, x + f.w]);
    if (f.type === 'pond') { const p = add('pond', x, { ev: 'skip', w: Math.round(f.w), h: 0, chance: 0.55 }); if (cond && cond.mod === 'ice' && (hash(dayKey, 'frozen', p.id) & 1)) p.data.frozen = true; }
    else if (f.type === 'walkway') add('walkway', x, { ev: 'walkway', w: Math.round(f.w), h: 5, chance: 0.8 });
    else if (f.type === 'bench') add('bench', x, { ev: 'bread', w: 46, h: 16, chance: 0.3 });
    else if (f.type === 'minicannon') add('minicannon', x, { ev: 'cannonception', w: 46, h: 26, chance: 0.2 });
    else if (f.type === 'cows') add('cows', x, { ev: 'cows', w: 220, h: 14, chance: 0.6, gag: true, data: { n: rng.int(4, 6) } });
  }
  const types = Object.keys(PIECE_DEFS);
  let x = 220, last = null;
  while (x < 4200) {

      jetstream(pc) { emit('jetstream', { piece: pc.id }, 1); s.forces.push({ kind: 'jet', pc, until: s.t + 2.4, ev: s.events[s.events.length - 1] }); s.pose = POSE.glide; },
      replyall(pc) { emit('replyall', { piece: pc.id }); s.vy = Math.min(s.vy, 0) - rng.range(45, 65); s.vx *= 0.74; s.pose = POSE.dizzy; },
      wormhole(pc) {
        const dx = rng.next() < 0.68 ? rng.range(120, 500) : -rng.range(80, 300);
        emit('wormhole', { piece: pc.id, dx }, 1.1);
        startScript('wormhole', 1.1, { x0: pc.x, y0: pc.y, dx, vx: s.vx, vy: s.vy });   // the script hides the duck once it is sucked in
      },
      crate(pc) {
        const prize = rng.weighted(C.CRATE_PRIZES, p => p.w).id;
        emit('crate', { piece: pc.id, prize }, 1.6);
        startScript('crate', 1.6, { x0: pc.x, y0: pc.y - 18, prize, vx: s.vx, vy: s.vy });
        s.pose = POSE.hover;
      },
      // air hazards
      pepper() { emit('pepper', {}, 1.5); const a = Math.atan2(Math.max(s.vy, 0) + 30, Math.max(s.vx, 40)); s.forces.push({ kind: 'rocket', until: s.t + 1.5, ax: Math.cos(a) * 68, ay: Math.sin(a) * 68 }); s.pose = POSE.rocket; },
      drone() { emit('drone', {}, 1.2); s.vx = Math.max(s.vx, 0) + rng.range(68, 100); s.vy += rng.range(18, 34); s.pose = POSE.scared; },
      pelican() { const d = rng.range(3.0, 4.5); emit('pelican', {}, d); startScript('carry', d, { speed: 82, alt: clamp(s.y + 70, 110, 200), rel: 62, pose: POSE.carried }); s.pose = POSE.carried; },
      migration() { const d = rng.range(3, 4.2); emit('migration', {}, d); startScript('carry', d, { speed: 86, alt: s.y, rel: 70, pose: POSE.carried }); s.pose = POSE.carried; },
      glider() { const d = rng.range(4.0, 6.0); emit('glider', {}, d); startScript('glide', d, {}); s.pose = POSE.glide; },
      geese() { emit('geese', {}); s.vx *= 0.45; s.vy = Math.min(s.vy, 0) * 0.5 - 8; s.pose = POSE.dizzy; s.spin = rng.range(-6, 6); },
      ooo() { emit('ooo', {}); s.vx = -Math.min(70, Math.abs(s.vx) * rng.range(0.25, 0.4)) - 8; s.vy = rng.range(12, 24); s.pose = POSE.dizzy; },
      ufo() {
        const r = rng.next();
        const outcome = r < 0.45 ? 'ahead' : r < 0.7 ? 'behind' : 'antennae';
        const dx = outcome === 'ahead' ? rng.range(500, 1000) : outcome === 'behind' ? -rng.range(90, 250) : 0;
        emit('ufo', { outcome, dx }, 3.0);
        startScript('ufo', 3.0, { x0: s.x, y0: s.y, dx, outcome });
        if (outcome === 'antennae') s.extra.antennaeT = s.t + 2.2;
      },
      space() {
        const D = rng.range(2400, 4300);
        emit('space', { D }, 7.4);
        startScript('space', 7.4, { x0: s.x, y0: s.y, D });
        s.pose = POSE.rocket;
      },
    };

    /* ----- scripted motions ----- */
    function runScript(dt) {
      const sc = s.sc, u = (s.t - sc.t0) / sc.dur;
      switch (sc.kind) {
        case 'misfire': {
          // plop out of the barrel, sit dazed, climb back in, re-fire with bonus powder
          const a = angle * DEG, mx = PIV.x + Math.cos(a) * PIV.len, my = PIV.y + Math.sin(a) * PIV.len;
          const tt = s.t - sc.t0;
          if (tt < 0.8) { const k = tt / 0.8; s.x = lerp(mx, mx + 16, k); s.y = lerp(my, groundY(mx + 16), k) + Math.sin(k * Math.PI) * 10; s.rot = k * 4; s.pose = POSE.dizzy; s.vis = 1; }
          else if (tt < 1.5) { s.x = mx + 16; s.y = groundY(s.x); s.rot = 0; s.pose = POSE.dizzy; }
          else { s.vis = 0; s.x = mx; s.y = my; }
          if (u >= 1) { s.vis = 1; emit('refire', { bonus: sc.bonus }); s.sc = null; launch(angle, Math.min(1.12, power * sc.bonus)); }
          return;
        }
        case 'wobble': {
          const k = easeOut(u);
          s.x = sc.x0 + sc.d * k; s.y = groundY(s.x); s.pose = sc.pose; s.rot = Math.sin(u * TAU * 2) * 0.15 * (1 - u);
          if (u >= 1) finish();
          return;
        }
        case 'castle': {
          const hopT = sc.dur / sc.n, i = Math.min(sc.n - 1, Math.floor((s.t - sc.t0) / hopT)), k = ((s.t - sc.t0) - i * hopT) / hopT;
          s.x = sc.x0 + sc.hop * (i + k); s.y = sc.y0 + Math.sin(k * Math.PI) * 30; s.rot += dt * 8; s.pose = POSE.scared;
          if (u >= 1) { s.vx = 88 + sc.hop; s.vy = 66; endScript(); }
          return;
        }
        case 'stuck': {
          s.x = approach(s.x, sc.x0, 14, dt); s.y = approach(s.y, sc.y0, 14, dt); s.rot = Math.sin(s.t * 10) * 0.08; s.pose = POSE.stuck;
          if (u >= 1) { s.vx = sc.rel; s.vy = 4; endScript(); s.pose = POSE.dizzy; }
          return;
        }
        case 'slidedown': {
          s.x = approach(s.x, sc.x0, 14, dt); s.vy = -26; s.y += s.vy * dt; s.rot = 0.4; s.pose = POSE.dizzy;
          if (s.y <= groundY(s.x)) { s.y = groundY(s.x); deadStop(POSE.dizzy, { held: true }); }
          return;
        }
        case 'hold': {
          // glide into the booth instead of popping there
          s.x = approach(s.x, sc.x0, 10, dt); s.y = approach(s.y, u > 0.85 ? groundY(s.x) : sc.y0, 10, dt); s.rot = 0; s.pose = POSE.stand;
          if (u >= 1) { s.vx = 0; s.vy = 0; s.y = groundY(s.x); deadStop(POSE.stand, { held: true, maxX: sc.maxX }); }
          return;
        }
        case 'pause': {
          s.x = approach(s.x, sc.x0, 12, dt); s.y = approach(s.y, sc.y0, 10, dt); s.rot = 0; s.pose = POSE.stand;
          if (u >= 1) { s.y = sc.y0; deadStop(POSE.stand, { held: true }); }
          return;
        }
        case 'nap': {
          const k = easeOut(Math.min(1, u * 4));
          s.x = lerp(sc.x0, sc.tx, k); s.y = lerp(sc.y0, sc.ty, k); s.rot = lerp(0, -0.25, k); s.pose = POSE.sleep;
          if (u > 0.82) s.y = lerp(sc.ty, groundY(s.x), easeInOut((u - 0.82) / 0.18));   // climb down before waking
          if (u >= 1) { s.y = groundY(s.x); deadStop(POSE.sleep, { held: true, maxX: sc.maxX }); }
          return;
        }
        case 'dive': {
          const k = easeInOut(Math.min(1, u * 2.2));
          s.x = lerp(sc.x0, sc.tx, k); s.y = lerp(sc.y0, sc.ty, k) + Math.sin(k * Math.PI) * 8; s.rot = (1 - k) * 0.6; s.pose = POSE.eat;
          if (u >= 1) { s.y = groundY(s.x); deadStop(POSE.eat, { held: true }); }
          return;
        }
        case 'reload': {
          s.x = sc.x0; s.y = sc.y0; s.vis = 0;
          if (u >= 1) { s.vis = 1; s.vx = sc.vx; s.vy = sc.vy; s.y = sc.y0 + 10; endScript(); s.pose = POSE.scared; s.wasUp = true; }
          return;
        }
        case 'walkway': {
          s.vx = approach(s.vx, sc.speed, 4, dt); s.x += s.vx * dt; s.y = groundY(s.x); s.pose = POSE.stand; s.rot = 0;
          if (s.x >= sc.end) { const e = s.events.find(e => e.id === 'walkway' && e.data.end === sc.end); if (e) e.tEnd = s.t; s.sc = null; s.mode = MODE.ground; s.vx = sc.speed + rng.range(0, 26); s.pose = POSE.slide; }
          return;
        }
        case 'pinball': {
          const n = sc.pts.length, seg = Math.min(n - 1, Math.floor(u * n)), k = u * n - seg;
          const a = seg === 0 ? { x: sc.x0, y: sc.y0 } : sc.pts[seg - 1], b = sc.pts[seg];
          s.x = lerp(a.x, b.x, k); s.y = lerp(a.y, b.y, k) + Math.sin(k * Math.PI) * 10; s.rot += dt * 10; s.pose = POSE.dizzy;
          if (u >= 1) { s.vx = sc.out.vx; s.vy = sc.out.vy; endScript(); s.pose = POSE.dizzy; }
          return;
        }
        case 'tornado': {
          const ang = (s.t - sc.t0) * 14;
          const tx = pieceX(sc.pc) + sc.pc.w / 2 + Math.sin(ang) * 18 * (1 - u * 0.3), blend = Math.min(1, (s.t - sc.t0) / 0.25);
          s.x = lerp(sc.x0, tx, easeOut(blend)); s.y = sc.y0 + easeOut(u) * sc.lift; s.rot += dt * 20; s.pose = POSE.spin;
          if (u >= 1) { s.vx = sc.vx; s.vy = sc.vy; endScript(); s.pose = POSE.dizzy; }
          return;
        }
        case 'wormhole': {
          const tt = s.t - sc.t0;
          if (tt < 0.35) { s.x = lerp(s.x, sc.x0, 0.2); s.y = lerp(s.y, sc.y0, 0.2); s.vis = 1; s.pose = POSE.spin; s.rot += dt * 18; }
          else if (tt < 0.75) { s.vis = 0; s.x = sc.x0 + sc.dx; s.y = sc.y0; }
          else { s.vis = 1; s.x = sc.x0 + sc.dx + (tt - 0.75) * 30; s.y = sc.y0; s.rot += dt * 10; }
          if (u >= 1) { s.vx = Math.max(25, Math.abs(sc.vx) * 0.6); s.vy = 10; endScript(); }
          return;
        }
        case 'crate': {
          s.x = approach(s.x, sc.x0, 10, dt); s.y = approach(s.y, sc.y0, 10, dt); s.pose = POSE.hover; s.rot = approach(s.rot, 0, 6, dt);
          if (u >= 1) {
            const vx0 = Math.max(sc.vx, 20) * 0.9, vy0 = Math.max(sc.vy, 0);
            if (sc.prize === 'rocket') { s.vx = vx0 + 105; s.vy = vy0 + 60; s.forces.push({ kind: 'rocket', until: s.t + 0.8, ax: 40, ay: 20 }); s.pose = POSE.rocket; }
            else if (sc.prize === 'balloons') { s.vx = Math.max(vx0, 30); s.vy = 30; s.forces.push({ kind: 'balloons', until: s.t + 2.4, ax: 6, ay: P.g * 1.05 }); }
            else if (sc.prize === 'reverse') { s.vx = -45; s.vy = 25; }
            else { s.vx = vx0; s.vy = vy0; s.extra.tinyHatT = s.t; }
            endScript(); if (sc.prize === 'rocket') s.pose = POSE.rocket;
          }
          return;
        }
        case 'carry': {
          s.vx = approach(s.vx, sc.speed, 2.5, dt);
          s.vy = (sc.alt + Math.sin((s.t - sc.t0) * 2.2) * 6 - s.y) * 1.6;
          s.x += s.vx * dt; s.y += s.vy * dt; s.rot = approach(s.rot, 0, 5, dt); s.pose = sc.pose;
          if (u >= 1) { s.vx = sc.rel; s.vy = 0; endScript(); }
          return;
        }
        case 'glide': {
          s.vx = approach(s.vx, 72, 1.8, dt); s.vy = approach(s.vy, -6, 2.2, dt);
          s.x += s.vx * dt; s.y += s.vy * dt; s.rot = approach(s.rot, 0, 5, dt); s.pose = POSE.glide;
          if (s.y <= groundY(s.x) + 0.5) { s.y = groundY(s.x); const e = s.events.find(e => e.id === 'glider'); if (e) e.tEnd = s.t; s.sc = null; s.mode = MODE.ground; s.vy = 0; s.vx *= 0.8; s.pose = POSE.slide; return; }
          if (u >= 1) { s.vx = 48; s.vy = -6; endScript(); }
          return;
        }
        case 'ufo': {
          const tt = s.t - sc.t0;
          if (tt < 1.3) { s.x = approach(s.x, sc.x0, 6, dt); s.y = sc.y0 + easeIn(tt / 1.3) * 120; s.vis = 1; s.rot += dt * 3; s.pose = POSE.hover; }
          else if (tt < 2.2) { s.vis = 0; s.x = sc.x0 + sc.dx; s.y = sc.y0 + 120; }
          else { s.vis = 1; s.x = sc.x0 + sc.dx; s.y = sc.y0 + 120 - easeOut((tt - 2.2) / 0.8) * 60; s.pose = sc.outcome === 'antennae' ? POSE.smug : POSE.dizzy; }
          if (u >= 1) { s.vx = 24; s.vy = 0; endScript(); }
          return;
        }
        case 'space': {
          const tt = s.t - sc.t0;
          const top = 2600;
          if (tt < 1.8) { const k = easeIn(tt / 1.8); s.y = lerp(sc.y0, top, k); s.x = sc.x0 + k * sc.D * 0.12; s.pose = POSE.rocket; s.rot = approach(s.rot, -0.6, 4, dt); }
          else if (tt < 3.6) { const k = (tt - 1.8) / 1.8; s.y = top + Math.sin(k * Math.PI) * 40; s.x = sc.x0 + sc.D * (0.12 + 0.2 * k); s.pose = POSE.space; s.rot = Math.sin(tt * 1.5) * 0.4; }
          else { const k = (tt - 3.6) / 3.8; s.y = lerp(top, groundY(sc.x0 + sc.D), easeInOut(k)); s.x = sc.x0 + sc.D * (0.32 + 0.68 * easeOut(k)); s.pose = POSE.chute; s.rot = Math.sin(tt * 2) * 0.12; }
          if (u >= 1) { s.y = groundY(s.x); s.vx = 22; s.vy = 0; s.sc = null; s.mode = MODE.ground; s.pose = POSE.slide; if (s.landT < 0) s.landT = s.t; }
          return;
        }
      }
    }

    /* ----- main loop ----- */
    if (special === 'misfire') { emit('misfire', {}); s.x = PIV.x + Math.cos(angle * DEG) * PIV.len; s.y = PIV.y + Math.sin(angle * DEG) * PIV.len; startScript('misfire', 3.0, { bonus: rng.range(1.12, 1.25) }); }
    else if (special === 'backfire') {
      emit('backfire', {});
      const a = angle * DEG;
      s.x = PIV.x - 6; s.y = PIV.y + 4;
      s.vx = -rng.range(34, 52); s.vy = rng.range(44, 62);
      s.mode = MODE.air; s.pose = POSE.scared; s.spin = -6;
    } else launch(angle, power);
    if (opts.force === 'space') s.extra.forceSpace = true;

    let pi0 = 0, pi0x = -1e9;   // pi0x: where the duck was when pi0 was last advanced
    while (s.mode !== MODE.done && s.t < MAX_T) {
      const dt = DT;
      if (record && step % REC === 0) {
        rec.x.push(s.x); rec.y.push(s.y); rec.rot.push(s.rot); rec.mode.push(s.mode); rec.pose.push(s.pose); rec.vis.push(s.vis);
      }
      const prevVy = s.vy;
      if (s.mode === MODE.script) runScript(dt);
      else if (s.mode === MODE.air) {
        let ax = 0, ay = 0;
        for (let i = s.forces.length - 1; i >= 0; i--) {
          const f = s.forces[i];
          if (f.kind === 'jet') {
            const pc = f.pc;
            if (s.x > pc.x + pc.w || s.y < pc.y - pc.h || s.y > pc.y + pc.h || s.t > f.until) { f.ev.tEnd = s.t; s.forces.splice(i, 1); if (s.pose === POSE.glide) s.pose = POSE.fly; continue; }
            ax += Math.max(0, 192 - s.vx) * 0.8; ay += P.g * 0.92 + (pc.y + 18 - s.y) * 0.6 - s.vy * 0.6;
          } else if (s.t > f.until) { s.forces.splice(i, 1); if (f.kind === 'rocket' && s.pose === POSE.rocket) s.pose = POSE.scared; }
          else { ax += f.ax; ay += f.ay; }
        }
        const rvx = s.vx - P.wind, sp = Math.sqrt(rvx * rvx + s.vy * s.vy);
        ax += -P.drag * sp * rvx; ay += -P.g - P.drag * sp * s.vy;
        s.vx += ax * dt; s.vy += ay * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        s.rot += s.spin * dt;
        // apex
        if (s.wasUp && prevVy > 0 && s.vy <= 0) {
          s.wasUp = false;
          if (s.apexT < 0) s.apexT = s.t;
          if (s.y > 140 && canFire() && !s.used.has('space') && (s.extra.forceSpace || (!only && rng.next() < C.EVENTS.space.rate))) { FX.space(); }
          if (s.pose === POSE.scared) s.pose = POSE.fly;
        }
        if (s.vy > 0) s.wasUp = true;
        // air hazards
        if (s.mode === MODE.air && canFire()) {
          for (let k = 0; k < AIR.length; k++) {
            const id = AIR[k].id, ev = AIR[k].ev;
            if (s.used.has(id)) continue;
            if (only && id !== only) continue;
            if (s.y < ev.band[0] || s.y > ev.band[1]) continue;
            if (ev.desc && s.vy > 0) continue;
            if (ev.season === 'autumn' && !cond.flags.autumn) continue;
            if (s.x < 0) continue;
            let rate = ev.rate * TUNE.airMul * chaos * (id === 'geese' ? P.goose : 1);
            if (opts.force === id) rate = 1e6;
            if (rng.next() < rate * dt) { FX[id](); break; }
          }
        }
        // ground contact
        const gy = groundY(s.x);
        if (s.mode === MODE.air && s.y <= gy) {
          s.y = gy;
          if (s.landT < 0) s.landT = s.t;
          if (s.deadOnLand) { s.deadOnLand = false; deadStop(POSE.stand); }
          else {
            const hit = groundPieceAt(s.x);
            if (hit >= 0 && canFireGround(hit)) { /* handled */ }
            else if (-s.vy > 24) { s.vy = -s.vy * P.rest * rng.range(0.85, 1.05); s.vx *= 0.8; s.spin = s.vx * 0.06 * rng.sign(); s.pose = POSE.dizzy; }
            else { s.vy = 0; s.mode = MODE.ground; s.pose = POSE.slide; }
          }
        }
      } else if (s.mode === MODE.ground) {
        // banana: a few seconds of slippery, with a floor so it can't slide forever on Ice Rink days
        if (s.slick && s.t - (s.slickT || 0) > 2.2) s.slick = false;
        let decel = s.slick ? Math.max(4, P.mu * P.g * 0.3) : P.mu * P.g;
        if (s.t > 52) decel *= 1 + (s.t - 52) * 0.6;   // nothing slides into the time cap
        decel = Math.max(decel, 1.2) + 0.0005 * s.vx * s.vx;   // air drag on a sliding duck: no runaway slides
        decel += Math.max(0, 14 - Math.abs(s.vx)) * 0.45;      // the last few ft/s dig in: no long crawl to a stop
        const sg = Math.sign(s.vx);
        s.vx -= sg * decel * dt;
        if (Math.sign(s.vx) !== sg || Math.abs(s.vx) < 1.2) { s.vx = 0; s.rot = 0; deadStopNatural(); }
        else {
          s.x += s.vx * dt; s.y = groundY(s.x); s.rot += s.vx * dt / 7;
          const hit = groundPieceAt(s.x);
          if (hit >= 0) canFireGround(hit);
        }
      }
      // tall / air pieces
      if (s.mode === MODE.air || s.mode === MODE.ground) {
        if (s.x < pi0x) pi0 = 0;   // thrown backward (tornado, wormhole, headwind): look at the pieces behind again
        while (pi0 < pieces.length && pieces[pi0].x + Math.max(pieces[pi0].w, 0) + 240 < s.x) pi0++;
        pi0x = s.x;
        for (let i = Math.max(0, pi0 - 6); i < pieces.length; i++) {
          const pc = pieces[i];
          if (pc.x - 240 > s.x) break;
          if (reach && !pieceRoll[i] && !pc.gag && !isGround[i] && !reach.has(pc.id) && !s.used.has(pc.ev) && canFire() && inPiece(pc, pc.type === 'tornado' ? s.x - (pieceX(pc) - pc.x) : s.x, s.y, s.vy, s.mode)) reach.add(pc.id);
          if (notTall[i] || s.used.has(pc.ev)) continue;
          if (!canFire()) break;
          if (inPiece(pc, pc.type === 'tornado' ? s.x - (pieceX(pc) - pc.x) : s.x, s.y, s.vy, s.mode)) { FX[pc.ev](pc); break; }
        }
      }
      if (s.mode !== MODE.done && s.y > groundY(s.x) + 2) s.air += dt;
      if (s.y > s.maxAlt) s.maxAlt = s.y;
      s.t += dt;
      step++;
    }
    // the time cap: a duck still up in the air drifts down so it never ends frozen in the sky
    if (s.mode !== MODE.done && s.y > groundY(s.x) + 0.5) {
      s.sc = null; s.vis = 1; s.mode = MODE.air; s.forces = [];
      for (let k = 0; k < HZ * 20 && s.y > groundY(s.x); k++) {
        if (record && step % REC === 0) { rec.x.push(s.x); rec.y.push(s.y); rec.rot.push(s.rot); rec.mode.push(s.mode); rec.pose.push(POSE.chute); rec.vis.push(1); }
        s.vy = Math.max(-45, Math.min(s.vy, 0) - P.g * DT); s.vx *= 0.995;
        s.x += s.vx * DT; s.y += s.vy * DT; s.t += DT; step++;
      }
      s.y = groundY(s.x);
    }
    if (s.mode !== MODE.done) finish();
    if (record) { rec.x.push(s.x); rec.y.push(s.y); rec.rot.push(0); rec.mode.push(MODE.done); rec.pose.push(s.pose); rec.vis.push(1); }

    function groundPieceAt(x) {
      for (let i = Math.max(0, pi0 - 6); i < pieces.length; i++) {
        const pc = pieces[i];
        if (pc.x > x) break;
        if (isGround[i] && x >= pc.x && x <= pc.x + pc.w && (!only || pieceRoll[i])) return i;   // under a debug force, look past pieces that are switched off
      }
      return -1;
    }
    function canFireGround(i) {
      const pc = pieces[i];
      if (pc.type === 'pond') {
        if (only && only !== 'skip' && only !== 'plop' && only !== 'lilypad') return false;
        // the pond is water: you either skip or you plop (no free pass)
        if (s.used.has('plop')) return false;

/* ---------- announcer voice (Web Speech, off by default) ---------- */
const Voice = {
  speak(text) {
    if (!S.settings.voice || S.settings.muted) return;
    try {
      const ss = window.speechSynthesis;
      if (!ss) return;
      ss.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[“”"]/g, ''));
      u.rate = 1.08; u.pitch = 1.15; u.volume = clamp(S.settings.volume * 1.4, 0, 1);
      ss.speak(u);
    } catch (e) { /* not available here */ }
  },
  stop() { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
  pause(on) { try { const ss = window.speechSynthesis; if (ss) { if (on) ss.pause(); else ss.resume(); } } catch (e) { /* ignore */ } },
};


/* ---------- ART: scenery (pre-rendered to offscreen canvases), world renderer, particles ---------- */
const GROUND_Y = 780;

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const SKY = {
  sunny: ['#3fa7ec', '#8fd3f7', '#cdeefe'],
  overcast: ['#7f93a8', '#a9b8c7', '#d5dde5'],
  drizzle: ['#6c7f95', '#97a7b9', '#c4ced8'],
  fog: ['#aab7c4', '#cfd8e0', '#eef2f5'],
  sunset: ['#3d3486', '#e9628a', '#ffc76e'],
  night: ['#0b1230', '#1d2a5c', '#3a4c86'],
};
function groundPalette(cond) {
  if (cond.flags.snow) return { a: '#eef3f8', b: '#dfe8f1', edge: '#c9d6e3', dirt: '#b7c6d6' };
  if (cond.mod === 'ice') return { a: '#d3ecf8', b: '#c2e3f4', edge: '#93c6e4', dirt: '#a9c9dc' };   // Ice Rink day: the field is a rink
  if (cond.flags.beach) return { a: '#f3d59b', b: '#eccb88', edge: '#d9b36b', dirt: '#c99f5a' };
  if (cond.flags.autumn) return { a: '#86bd4c', b: '#7bb244', edge: '#5f9636', dirt: '#8b6a3e' };
  return { a: '#6cc04a', b: '#62b442', edge: '#4c9a35', dirt: '#8b6a3e' };
}

const Scenery = {
  key: null,
  build(cond) {
    const key = cond.dayKey + cond.sky + cond.season + cond.friday + cond.mod;
    if (this.key === key) return;
    this.key = key;
    const sk = SKY[cond.sky] || SKY.sunny;
    // sky
    const sky = this.sky = mkCanvas(1920, 1080);
    let c = sky.getContext('2d');
    const g = c.createLinearGradient(0, 0, 0, 1080);
    g.addColorStop(0, sk[0]); g.addColorStop(0.55, sk[1]); g.addColorStop(1, sk[2]);
    c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
    const r = new Rng(hash('sky', cond.dayKey));
    if (cond.sky === 'night') {
      for (let i = 0; i < 140; i++) { const x = r.range(0, 1920), y = r.range(0, 700), s = r.range(1.5, 3.5); c.fillStyle = 'rgba(255,255,240,' + r.range(0.5, 1) + ')'; circ(c, x, y, s); c.fill(); }
      for (let i = 0; i < 6; i++) { starPath(c, r.range(100, 1800), r.range(40, 500), r.range(6, 10), 0); c.fillStyle = '#fff6c8'; c.fill(); }
    }
    // far layer (low contrast)
    const far = this.far = mkCanvas(2400, 460);
    c = far.getContext('2d');
    const farCol = cond.flags.snow ? ['#c9d6e6', '#e8eff7'] : cond.flags.autumn ? ['#c7a77a', '#d8bc93'] : cond.sky === 'night' ? ['#2a3866', '#334474'] : cond.sky === 'sunset' ? ['#b2708f', '#c98e9e'] : ['#9fd1b0', '#b9e0c4'];
    if (cond.flags.beach) {
      c.fillStyle = '#5fb7e8'; c.fillRect(0, 300, 2400, 160);
      c.fillStyle = 'rgba(255,255,255,0.6)'; for (let x = 0; x < 2400; x += 60) { c.fillRect(x + (x % 120 ? 10 : 30), 330 + (x % 180) / 6, 26, 4); }
      c.fillStyle = '#ffe9a8'; circ(c, 1700, 220, 70); c.fill();
    } else {
      const ridge = (base, amp, col, seed) => { const rr2 = new Rng(seed); c.fillStyle = col; c.beginPath(); c.moveTo(0, 460); let y = base; for (let x = 0; x <= 2400; x += 40) { const k = x / 2400 * TAU; y = base - amp * (0.5 + 0.5 * Math.sin(k * 2 + seed % 7)) - amp * 0.4 * Math.sin(k * 5 + 1.3); c.lineTo(x, y); } c.lineTo(2400, 460); c.closePath(); c.fill(); };
      ridge(250, 140, farCol[1], 3);
      ridge(330, 110, farCol[0], 11);
      if (cond.flags.snow) { c.fillStyle = '#ffffff'; for (let x = 120; x < 2400; x += 480) { c.beginPath(); c.moveTo(x - 60, 200); c.lineTo(x, 130); c.lineTo(x + 60, 200); c.closePath(); c.fill(); } }
    }
    // near layer
    const near = this.near = mkCanvas(2400, 300);
    c = near.getContext('2d');
    const nearCol = cond.flags.snow ? '#dde7f0' : cond.flags.beach ? '#ecc98a' : cond.flags.autumn ? '#9fbf5a' : cond.sky === 'night' ? '#2f5b46' : '#7fc867';
    c.fillStyle = nearCol; c.beginPath(); c.moveTo(0, 300);
    for (let x = 0; x <= 2400; x += 30) { const k = x / 2400 * TAU; c.lineTo(x, 170 - 60 * Math.sin(k * 3 + 0.7) - 25 * Math.sin(k * 7)); }
    c.lineTo(2400, 300); c.closePath(); c.fill();
    const treeR = new Rng(hash('trees', cond.dayKey));
    for (let i = 0; i < 26; i++) {
      const x = treeR.range(0, 2400), k = x / 2400 * TAU, y = 170 - 60 * Math.sin(k * 3 + 0.7) - 25 * Math.sin(k * 7) + 8;
      if (cond.flags.beach) { c.strokeStyle = '#a77a45'; c.lineWidth = 6; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 8, y - 30, x + 4, y - 60); c.stroke(); c.fillStyle = '#5fae5a'; for (let j = 0; j < 5; j++) { ell(c, x + 4 + Math.cos(j * 1.25) * 18, y - 62 + Math.sin(j * 1.25) * 6, 20, 6, j * 1.25); c.fill(); } continue; }
      const col = cond.flags.autumn ? treeR.pick(['#e08a2e', '#d1652a', '#e9b63b', '#9db84a']) : cond.flags.snow ? '#6f9a7b' : cond.sky === 'night' ? '#244a3a' : treeR.pick(['#5cae4a', '#4f9f42', '#69b955']);
      c.fillStyle = '#7a5a3a'; c.fillRect(x - 4, y - 26, 8, 28);
      c.fillStyle = col; circ(c, x, y - 40, treeR.range(18, 28)); c.fill();
      if (cond.flags.snow) { c.fillStyle = '#ffffff'; ell(c, x, y - 58, 16, 6); c.fill(); }
    }
    // clouds
    this.clouds = [];
    const cloudCol = cond.sky === 'overcast' || cond.sky === 'drizzle' ? '#e2e7ee' : cond.sky === 'night' ? '#4a5a8a' : cond.sky === 'sunset' ? '#ffd9c2' : '#ffffff';
    for (let i = 0; i < 5; i++) {
      const cv = mkCanvas(360, 160); const cc = cv.getContext('2d');
      const cr = new Rng(hash('cloud', i));
      const blobs = []; for (let j = 0; j < 6; j++) blobs.push([cr.range(70, 290), cr.range(70, 100), cr.range(30, 55)]);
      cc.fillStyle = 'rgba(31,26,46,0.12)'; for (const b of blobs) { circ(cc, b[0], b[1] + 8, b[2]); cc.fill(); }
      cc.fillStyle = cloudCol; for (const b of blobs) { circ(cc, b[0], b[1], b[2]); cc.fill(); }
      cc.fillRect(70, 100, 220, 30);
      this.clouds.push(cv);
    }
    this.ground = groundPalette(cond);
  },
};

/* ---------- camera / view ---------- */
function makeView(cx, gy, z) {
  return { cx, gy, z, sx: x => 960 + (x - cx) * z, sy: y => gy - y * z, wx: px => cx + (px - 960) / z };
}

/* ---------- particles (capped) ---------- */
const Particles = {
  list: [], max: 260,
  add(p) { if (this.list.length >= this.max) this.list.shift(); p.age = 0; this.list.push(p); return p; },
  clear() { this.list.length = 0; },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.age += dt;
      if (p.age >= p.life) { this.list.splice(i, 1); continue; }
      p.vx = (p.vx || 0) * (p.drag ? Math.exp(-p.drag * dt) : 1); p.vy = (p.vy || 0) * (p.drag ? Math.exp(-p.drag * dt) : 1);
      p.vy += (p.g || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.spin) p.rot = (p.rot || 0) + p.spin * dt;
    }
  },
  draw(ctx, V, layer) {
    for (const p of this.list) {
      if ((p.layer || 'world') !== layer) continue;
      const k = p.age / p.life;
      const x = p.ws ? V.sx(p.x) : p.x, y = p.ws ? V.sy(p.y) : p.y;
      if (x < -100 || x > 2020 || y < -100 || y > 1180) continue;
      ctx.save();
      switch (p.type) {
        case 'smoke': { const r = (p.r || 20) * (0.6 + k * 1.4); ctx.globalAlpha = (p.a || 0.7) * (1 - k); circ(ctx, x, y, r); ctx.fillStyle = p.color || '#d9dde5'; ctx.fill(); break; }
        case 'ring': { const r = (p.r || 30) * (0.4 + k * 2.2); ctx.globalAlpha = 0.85 * (1 - k); ctx.lineWidth = 14 * (1 - k) + 3; ctx.strokeStyle = '#eef0f4'; ell(ctx, x, y, r, r * 0.65, p.rot || 0); ctx.stroke(); break; }
        case 'flash': { const r = (p.r || 80) * (0.6 + k); const gg = ctx.createRadialGradient(x, y, 0, x, y, r); gg.addColorStop(0, 'rgba(255,250,220,' + (0.95 * (1 - k)) + ')'); gg.addColorStop(0.5, 'rgba(255,190,80,' + (0.6 * (1 - k)) + ')'); gg.addColorStop(1, 'rgba(255,140,40,0)'); ctx.fillStyle = gg; circ(ctx, x, y, r); ctx.fill(); break; }
        case 'feather': { ctx.translate(x, y); ctx.rotate(p.rot || 0); ctx.globalAlpha = 1 - k * k; ell(ctx, 0, 0, p.r || 10, (p.r || 10) * 0.38); fillStroke(ctx, p.color || '#fff', 2.5); break; }
        case 'confetti': { ctx.translate(x, y); ctx.rotate(p.rot || 0); ctx.globalAlpha = k > 0.85 ? (1 - k) / 0.15 : 1; ctx.fillStyle = p.color; ctx.fillRect(-(p.r || 8), -(p.r || 8) * 0.45, (p.r || 8) * 2, (p.r || 8) * 0.9); break; }
        case 'spark': { ctx.globalAlpha = 1 - k; circ(ctx, x, y, (p.r || 5) * (1 - k * 0.5)); ctx.fillStyle = p.color || '#ffd23f'; ctx.fill(); break; }
        case 'star': { ctx.globalAlpha = 1 - k; starPath(ctx, x, y, (p.r || 10), p.rot || 0); fillStroke(ctx, p.color || '#ffd23f', 2.5); break; }
        case 'dust': { ctx.globalAlpha = 0.6 * (1 - k); circ(ctx, x, y, (p.r || 14) * (0.5 + k)); ctx.fillStyle = p.color || '#cdb894'; ctx.fill(); break; }
        case 'blob': { ctx.globalAlpha = 1 - k; circ(ctx, x, y, p.r || 6); ctx.fillStyle = p.color || '#6b4423'; ctx.fill(); break; }

/* ---------- captions: Bill's lower third + big impact text + duck speech bubbles ---------- */
const Caps = {
  queue: [], cur: null, curStart: 0, bigs: [], bubble: null, lastAt: 0,   // lastAt: when something new last appeared
  reset() { this.queue = []; this.cur = null; this.bigs = []; this.bubble = null; this.side = null; },
  // is Bill free to start a new line right now?
  free() { return !this.queue.length && (!this.cur || S.rt - this.curStart >= this.cur.min); },
  say(text, o) {
    if (!text) return;
    o = o || {};
    // a filler remark only speaks when Bill is free right now: it never waits in line, never replaces anything,
    // and leaves the bar after a few seconds
    if (o.filler && !this.free()) return false;
    const item = { text, min: Math.max(2.0, o.min || 0), at: S.rt + (o.delay || 0), prio: o.prio || 0, filler: o.filler || null, max: o.filler ? 2.8 : 0 };
    this.lastAt = Math.max(this.lastAt, item.at);
    // Bill never falls behind the action: a newer line replaces anything still waiting at the same or lower priority
    // (lines scheduled for later at the same priority are a planned sequence and stay)
    const now = S.rt;
    // a line scheduled for later is a follow-up, so it doesn't knock out what's waiting now
    if (!((o.delay || 0) > 0.5)) this.queue = this.queue.filter(q => q.prio > item.prio || (q.prio === item.prio && q.at > now + 0.05));
    this.queue.push(item);
    // over capacity: drop the least important line that's waiting (oldest first), never the newest
    while (this.queue.length > 5) { let wi = 0; for (let i = 1; i < this.queue.length - 1; i++) if (this.queue[i].prio < this.queue[wi].prio) wi = i; this.queue.splice(wi, 1); }
  },
  big(text, o) {
    o = o || {};
    // one impact caption at a time: the previous one fades out quickly
    const now = S.rt;
    for (const b of this.bigs) if (b.t0 <= now && (o.delay || 0) <= 0.05) b.dur = Math.min(b.dur, now - b.t0 + 0.22);
    this.lastAt = Math.max(this.lastAt, S.rt + (o.delay || 0));
    this.bigs.push({ text, t0: S.rt + (o.delay || 0), dur: Math.max(2, o.dur || 2), color: o.color || '#ffd23f', px: o.px || 96, y: o.y || 300, fixedY: !!o.y }); if (this.bigs.length > 2) this.bigs.shift(); },
  // seconds until the newest impact caption has had `min` seconds on screen (0 when none is that fresh)
  freshBig(min) { let w = 0; for (const b of this.bigs) { const age = S.rt - b.t0; if (age < min && age < b.dur) w = Math.max(w, min - age); } return w; },
  shift(d) { if (!(d > 0)) return; this.lastAt += d; this.queue.forEach(q => { q.at += d; }); this.curStart += d; this.bigs.forEach(b => { b.t0 += d; }); if (this.bubble) this.bubble.t0 += d; },
  bubbleSay(text, o) { if (!text) return; this.lastAt = Math.max(this.lastAt, S.rt + ((o && o.delay) || 0)); this.bubble = { text, t0: S.rt + ((o && o.delay) || 0), dur: Math.max(2, (o && o.dur) || 2.4) }; },
  update() {
    const now = S.rt;
    // a real line waits for the current one's 2 s; a filler steps aside for it after a moment
    if (this.cur && now - this.curStart >= (this.cur.filler ? 0.9 : this.cur.min) && this.queue.some(q => q.at <= now)) this.cur = null;
    if (this.cur && now - this.curStart > (this.cur.max || this.cur.min + 3.5)) this.cur = null;
    if (!this.cur) {
      const i = this.queue.findIndex(q => q.at <= now);

    }

  },
  drawBar(ctx) {
    const c = this.cur;

    const k = c ? easeOut((now - this.curStart) / 0.25) : 0;
    if (!c) return;

    rr(ctx, x + 140, y - 14, 300, 38, 12); fillStroke(ctx, '#e8412c', 4);
    txt(ctx, 'BILL FEATHERSTONE', x + 290, y + 5, { px: 22, color: '#fff', sw: 0 });
    drawBill(ctx, x + 66, y + h / 2, 64, S.rt, now - this.curStart < 1.6);
    ctx.font = font(34, 800);
    const lines = wrapText(ctx, c.text, w - 190, 2);
    lines.forEach((ln, i) => txt(ctx, ln, x + 150 + (1 - k) * 30, y + h / 2 + (i - (lines.length - 1) / 2) * 38 + 6, { px: 34, weight: 800, color: OUT, sw: 0, align: 'left' }));
    ctx.restore();
  },
  side: null,
  drawBigs(ctx, avoidY) {
    // keep impact captions on the far side of the duck (with hysteresis so they don't flip-flop)
    if (avoidY != null) {
      if (this.side == null) this.side = avoidY < 520 ? 'low' : 'high';
      else if (this.side === 'low' && avoidY > 610) this.side = 'high';
      else if (this.side === 'high' && avoidY < 430) this.side = 'low';
    }
    let off = 0;
    for (const b of this.bigs) {
      const t = S.rt - b.t0;
      if (t < 0) continue;
      const hh = String(b.text).split('\n').length * b.px * 1.05;
      if (avoidY != null && !b.fixedY) {
        if (!b.yset) this.side = avoidY < 520 ? 'low' : 'high';   // a new caption starts on the side away from the duck
        const ty = this.side === 'low' ? 790 - hh / 2 - off : 178 + hh / 2 + off;
        b.y = b.yset ? approach(b.y, ty, 12, 1 / 60) : ty; b.yset = true;

      const lines = String(b.text).split('\n');
      lines.forEach((ln, i) => txt(ctx, ln, 0, (i - (lines.length - 1) / 2) * b.px * 1.05, { px: b.px, color: b.color, sw: b.px * 0.2, maxW: 1500, shadow: true }));

  },
  drawBubble(ctx, x, y, left) {
    const b = this.bubble;
    if (!b || S.rt < b.t0) return;
    const t = S.rt - b.t0;
    const k = easeBack(t / 0.25);
    ctx.save();
    ctx.font = font(32, 900);
    const lines = wrapText(ctx, b.text, 440, 3);
    const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 44, h = lines.length * 38 + 30;
    // left: after landing, the duck's own flag label is to the right, so the bubble goes left
    let bx = clamp(left ? x - 60 - w : x + 50, 20, 1490 - w), by = clamp(y - h - (left ? 150 : 70), 174, 780 - h);
    ctx.translate(bx + w / 2, by + h / 2); ctx.scale(k, k); ctx.translate(-(bx + w / 2), -(by + h / 2));
    const tx = clamp(x + 20, bx + 30, bx + w - 30), ty = by + h;
    ctx.beginPath(); ctx.moveTo(tx - 16, ty - 6); ctx.lineTo(clamp(x + 10, bx - 40, bx + w + 40), clamp(y - 40, ty + 10, ty + 60)); ctx.lineTo(tx + 12, ty - 6); ctx.closePath(); fillStroke(ctx, '#ffffff', 5);
    rr(ctx, bx, by, w, h, 22); fillStroke(ctx, '#ffffff', 5);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(tx - 13, ty - 8, 24, 8);
    lines.forEach((ln, i) => txt(ctx, ln, bx + w / 2, by + 34 + i * 38, { px: 32, color: OUT, sw: 0 }));
    ctx.restore();
  },
};

/* ---------- commentary picker: shuffled bags so nothing repeats within a show ---------- */
const Lines = {
  bags: {}, rng: new Rng(1), used: new Set(), last: {},
  reset(seed) { this.bags = {}; this.rng = new Rng(hash('lines', seed >>> 0)); this.used = new Set(); this.last = {}; },
  fill(text, vars) { return String(text).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null ? vars[k] : m)); },
  next(pool, vars, isDuck) {
    const src = ((isDuck ? C.DUCK_LINES[pool] : C.LINES[pool]) || []).filter(l => typeof l === 'string' && l);
    if (!src || !src.length) return null;
    const bk = (isDuck ? 'd:' : 'b:') + pool;
    let bag = this.bags[bk];
    for (let tries = 0; tries < src.length * 2 + 2; tries++) {
      if (!bag || !bag.length) {
        // a fresh pass through this pool: its lines are fair game again, but never the one just said
        src.forEach(l => this.used.delete(l));
        bag = this.bags[bk] = this.rng.shuffle(src);
        if (bag.length > 1 && bag[0] === this.last[bk]) bag.push(bag.shift());
      }
      const line = bag.shift();
      const safeCheck = this.fill(line, Object.assign({}, vars, { player: 'Player' }));
      if (Blocklist.hit(safeCheck)) continue;
      if (this.used.has(line) && tries < src.length) continue;
      this.used.add(line); this.last[bk] = line;
      return this.fill(line, vars);
    }
    return this.fill(src[0], vars);
  },
};
function say(pool, vars, o) { const l = Lines.next(pool, vars); if (l) Caps.say(l, o); return l; }
function quip(pool, o) { if (typeof L !== 'undefined' && L.quietUntil > S.rt) return null; const l = Lines.next(pool, {}, true) || Lines.next('generic', {}, true); if (l) Caps.bubbleSay(l, o); return l; }

/* ---------- screen shake (gentle, can be turned off) ---------- */
const Shake = { amp: 0, t: 0, add(a) { if (S.settings.shake) this.amp = Math.min(14, Math.max(this.amp, a)); }, update(dt) { this.amp = approach(this.amp, 0, 6, dt); this.t += dt; }, offset() { return this.amp < 0.3 ? [0, 0] : [Math.sin(this.t * 37) * this.amp, Math.cos(this.t * 29) * this.amp * 0.7]; } };

/* ---------- iris transition (cartoon wipe instead of whip pans) ---------- */
const Iris = { t: -1, dur: 0.7, mid: null, fired: false, cx: 960, cy: 540,
  start(mid, cx, cy) { this.t = 0; this.mid = mid; this.fired = false; this.cx = cx || 960; this.cy = cy || 540; },
  update(dt) { if (this.t < 0) return; this.t += dt; if (!this.fired && this.t >= this.dur / 2) { this.fired = true; if (this.mid) this.mid(); } if (this.t >= this.dur) this.t = -1; },
  draw(ctx) {
    if (this.t < 0) return;
    const u = this.t / this.dur, k = u < 0.5 ? 1 - easeInOut(u * 2) : easeInOut((u - 0.5) * 2);
    const r = 40 + k * 1200;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 1920, 1080); ctx.arc(this.cx, this.cy, r, 0, TAU, true); ctx.fillStyle = OUT; ctx.fill('evenodd'); ctx.restore();
  },
};

/* ---------- pause: the show, captions, wipes, sound and voice all hold still ---------- */
function setPaused(on) {
  on = !!on;

  else { Caps.shift(S.rt - (S.pauseAt || S.rt)); Big.changedAt = S.rt; SFX.pause(false); Voice.pause(false); if (S.previewVol) { S.previewVol = false; SFX.play('quack', 1.2); } }
  S.paused = on;

const Modal = {

// In-page yes/no box: some hosted frames refuse window.confirm
function confirmBox(message, yesLabel, onYes, onNo) {
  Modal.open('<h2>Are you sure?</h2><div style="font-size:26px;font-weight:800">' + esc(message) + '</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="cno">Cancel</button><button class="btn danger" id="cyes">' + esc(yesLabel) + '</button></div>', el => {

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// Copy text with a fallback text box (some hosted frames block the clipboard)
function copyText(text, title) {
  const fallback = () => Modal.open('<h2>' + esc(title || 'Copy this') + '</h2><div class="note">Your browser blocked the clipboard here. Select all and copy:</div><textarea class="out" readonly>' + esc(text) + '</textarea><div class="row"><button class="btn" id="mclose">Close</button></div>', el => { const ta = el.querySelector('textarea'); ta.focus(); ta.select(); el.querySelector('#mclose').onclick = () => Modal.close(); });
  try {

    } else fallback();

}
function downloadText(text, filename) {
  const fallback = () => Modal.open('<h2>Export data</h2><div class="note">Downloads are blocked here. Copy this text and save it as <b>' + esc(filename) + '</b>:</div><textarea class="out" readonly>' + esc(text) + '</textarea><div class="row"><button class="btn" id="mclose">Close</button></div>', el => { const ta = el.querySelector('textarea'); ta.focus(); ta.select(); el.querySelector('#mclose').onclick = () => Modal.close(); });
  let framed = false;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  // sandboxed frames (hosted previews, artifact viewers) silently drop downloads: go straight to the text box
  if (framed) return fallback();
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    if (!('download' in a)) return fallback();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);

}
function exportData() { downloadText(JSON.stringify(Store.exportAll(), null, 1), 'duck-duck-boom-backup-' + localDayKey() + '.json'); }
function importDataFromText(text, confirmed) {
  try {
    const obj = JSON.parse(text);
    Store.importAll(obj, true);   // check it first: nothing is written if the backup is damaged
    // a restore replaces everything: say so before anything saved here would be lost
    const D = obj.data, lose = [];
    const theirs = D.history && Array.isArray(D.history.races) ? D.history.races.length : 0;
    if (S.history.length > theirs) lose.push(S.history.length + ' saved race' + (S.history.length === 1 ? '' : 's') + ' (the backup has ' + theirs + ')');
    if (!D.current && savedShow()) lose.push('the show in progress');
    if (!(D.roster && D.roster.people && D.roster.people.length) && S.roster.length) lose.push('the roster of ' + S.roster.length);
    if (lose.length && !confirmed) {
      confirmBox('Importing replaces everything saved in this browser with the backup. This would erase ' + lose.join(', ') + '. Export first if you are not sure.', 'Replace my data', () => importDataFromText(text, true));
      return false;
    }

    S.settings = loadSettings(); S.roster = loadRoster(); S.history = loadHistory();

  } catch (e) { Toast.show('Import failed: ' + e.message, 3000); return false; }
}

/* ---------- roster screen (DOM) ---------- */
const Roster = {
  el: null,
  show() {
    this.el = document.getElementById('roster');

    this.render();
  },
  hide() { if (this.el) this.el.classList.add('hidden'); },
  uniqueName(name, exceptId) {
    let base = cleanName(name), n = base, i = 2;
    const taken = new Set(S.roster.filter(p => p.id !== exceptId).map(p => personKey(p.name)));
    while (taken.has(personKey(n))) { const suf = ' (' + (i++) + ')'; n = Array.from(base).slice(0, NAME_MAX - suf.length).join('').trim() + suf; }
    return n;
  },
  tick(p) { if (p) { if (!p.checked) p.td = localDayKey(); p.checked = true; } },
  add(name, team, checked) {
    name = cleanName(name);
    if (!name) return null;
    const p = { id: 'p' + hex8(hash(name, S.roster.length, Date.now())), name: this.uniqueName(name), team: clamp(team | 0, 0, 2), checked: checked !== false, ammo: 0, td: checked !== false ? localDayKey() : null };
    S.roster.push(p);
    return p;
  },
  teamFromText(t) {
    t = String(t || '').trim().toLowerCase();
    if (!t) return null;
    const idx = S.settings.teams.findIndex(x => x.name.toLowerCase() === t);
    if (idx >= 0) return idx;
    // the whole cell has to be a team ('Team 2', 'team2', 'T2', '2'): dates, times and '3 meetings' are not
    const m = /^(?:team\s*|t)?([1-3])$/.exec(t);
    return m ? +m[1] - 1 : null;
  },
  filter: '',
  rename(id, value) {
    const p = S.roster.find(x => x.id === id);

  // "Today's list": tick exactly these people (adding anyone new), untick everyone else
  applyList(text, only) {
    const lines = String(text || '').split(/\r?\n|;/);

      // Outlook / Teams attendee lists: "Jamie Rivera <jamie@x.com>" or a bare address
      ln = ln.replace(/<[^>]*@[^>]*>/g, ' ').replace(/\(([^)]*@[^)]*)\)/g, ' ');
      ln = ln.replace(/^\s*["']\s*|\s*["']\s*$/g, '');   // "Display Name" <address>
      if (/^\s*[^\s@,]+@[^\s@,]+\s*$/.test(ln)) ln = ln.trim().split('@')[0].replace(/[._]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      if (!ln.trim()) continue;

      const parts = ln.split(/\t|,/).map(x => x.trim()).filter(Boolean);
      if (!parts.length) continue;
      let first = parts[0].replace(/^[\s\-*•]+|^\d+[.)]\s*/g, '');
      let tm = null;
      for (const c of parts.slice(1)) { const t = this.teamFromText(c); if (t != null) { tm = t; break; } }
      // "Smith, John" (no team after the comma, one word each side) -> John Smith
      // "Smith, John" -> John Smith, but only when nothing says otherwise: a known "John Smith", or two names nobody has yet
      if (tm == null && parts.length === 2 && !/\t/.test(ln) && !/\s/.test(first) && /^[^\s\d]+$/.test(parts[1]) && !/^team$/i.test(parts[1])) {
        const known = n => S.roster.some(x => personKey(x.name) === personKey(cleanName(n)));
        const swapped = parts[1] + ' ' + first;

        else if (known(first) && known(parts[1])) { if (!extra.includes(parts[1])) extra.push(parts[1]); }   // "Jamie, Sam": two people
        else if (!known(first) && known(parts[1])) first = parts[1];            // "Rivera, Jamie" with a first-name roster -> Jamie
        else if (!known(first)) first = swapped;                                // two new words: assume Last, First

/* ---------- race bookkeeping (saved after every step so a reload resumes the same show) ---------- */
function saveRace() { if (S.race) Store.set('current', S.race); }
function nameCtx(exceptKey) {
  const day = S.race ? S.race.day : S.day;
  const others = S.race ? S.race.players.filter(p => p.key !== exceptKey) : [];
  const taken = new Set(others.map(p => p.duck.name));
  const takenWords = new Set([].concat(...others.map(p => nameWords(p.duck.name))));
  const firsts = new Set(S.roster.map(p => firstWord(p.name)).concat(S.race ? S.race.players.map(p => firstWord(p.name)) : []).filter(w => w.length >= 2));
  return { recent: recentNameSet(day), taken, takenWords, firsts };
}
function makePlayer(name, team, rerolls, ctx, day) {
  const key = personKey(name);
  const duck = generateDuck(duckSeed(day, name, rerolls), { ctx, forceRarity: S.dbg.rarity || null });
  return { key, name, team, rerolls, duck };
}
function createRace() {
  const people = [];
  const seenKeys = new Set();
  // same order as the roster columns (team, then name), so who's left out past 40 is predictable
  const ticked = S.roster.filter(p => p.checked).slice().sort((a, b) => (a.team | 0) - (b.team | 0) || String(a.name).localeCompare(String(b.name), undefined, { sensitivity: 'base' }));
  const left = [];
  for (const p of ticked) {
    if (people.length >= 40) { left.push(cleanName(p.name)); continue; }
    let nm = cleanName(p.name) || 'Mystery Player', i = 2;
    const base = nm;
    while (seenKeys.has(personKey(nm))) nm = base + ' (' + (i++) + ')';
    seenKeys.add(personKey(nm));
    people.push({ name: nm, team: clamp(p.team | 0, 0, 2), ammo: p.ammo | 0 });
  }
  if (!people.length) { Toast.show('Tick at least one person first.'); return false; }
  if (left.length) Toast.show('Only 40 ducks fit in Thunderbill. Sitting out: ' + left.slice(0, 4).join(', ') + (left.length > 4 ? ' +' + (left.length - 4) + ' more' : ''), 6500);
  const day = S.dbg.day || localDayKey();
  S.day = day;
  const seed = S.dbg.seed != null ? S.dbg.seed >>> 0 : freshSeed();
  const rer = loadRerolls(day);
  const ctx = { recent: recentNameSet(day), taken: new Set(), takenWords: new Set(), firsts: new Set(S.roster.map(p => firstWord(p.name)).filter(w => w.length >= 2)) };
  const players = people.map(p => {
    const pl = makePlayer(p.name, p.team, rer[personKey(p.name)] || 0, ctx, day);
    pl.ammo = S.settings.bonusAmmo ? (p.ammo | 0) : 0;
    ctx.taken.add(pl.duck.name);
    for (const w of nameWords(pl.duck.name)) ctx.takenWords.add(w);
    return pl;
  });
  const order = new Rng(hash(seed, 'order')).shuffle(players.map((_, i) => i));
  const races = S.history;
  const last = lastRealRace(races);
  const rec = allTimeRecord(races);
  const lastWinner = last ? last.res.slice().sort((a, b) => b.dist - a.dist)[0] : null;
  S.race = {
    v: 1, id: hex8(seed), seed, day, practice: !!S.settings.practice, created: Date.now(),
    players, queue: order.map(pi => ({ p: pi, s: 0 })), idx: 0, stage: 'reveal', results: {}, shots: {},
    ov: Object.keys(S.dbg.ov).length ? deepClone(S.dbg.ov) : null,
    champ: lastWinner ? personKey(lastWinner.p) : null,
    lastWin: lastWinner ? lastWinner.dist : null,
    record: rec ? rec.dist : null, recordStart: rec ? rec.dist : null,
    leaderKey: null, legend: [], revealDone: false, shuffled: false,
  };
  // bonus round shots go at the very end
  if (S.settings.bonusAmmo) players.forEach((pl, pi) => { for (let k = 1; k <= (pl.ammo | 0); k++) S.race.queue.push({ p: pi, s: k, bonus: true }); });
  S.turbo = !!S.settings.turboDefault || players.length > 15;
  // personal bests and the current streak, for Bill's callbacks
  const F = computeFame(races, day);
  S.race.pbs = {};
  F.players.forEach(p => { const k = personKey(p.name); if (players.some(x => x.key === k)) S.race.pbs[k] = Math.round(p.best); });
  S.race.streak = F.streak && F.streak.n >= 2 && players.some(x => x.key === F.streak.key) ? { key: F.streak.key, n: F.streak.n } : null;
  rememberNames(day, players.map(p => p.duck.name));
  refreshWorld();
  Lines.reset(seed);
  saveRace();
  return true;
}
function rerollDuck(pi) {
  const R = S.race;
  if (!R || R.stage !== 'reveal') return;
  const pl = R.players[pi];
