// highlights: a line that does not fit at 28px wraps once, and the panel stays above the big button
function layoutHighlights(ctx, hl) {
  const maxW = 1520, y0 = 590, first = y0 + 84, ceil = 900, tail = 34;   // five ordinary lines already end here, above the safety lid
  const rows = (hl || []).map(h => {
    const text = '• ' + h;
    ctx.font = font(28, 800);
    return { lines: ctx.measureText(text).width <= maxW ? [text] : wrapText(ctx, text, maxW, 2) };
  });
  if (!rows.length) return { rows, ys: [], y0, boxH: 70, px: 28 };
  // the space inside a wrapped row stays a full line; only the gaps between rows (and then the type) give way
  const at = px => {
    const lead = px * 1.15;
    const core = rows.map(r => r.lines.length > 1 ? lead : 0);
    const gap0 = [];
    for (let i = 0; i < rows.length - 1; i++) gap0.push(rows[i].lines.length > 1 ? 36 : 48);
    const place = gaps => {
      const ys = [];
      let y = first;
      rows.forEach((r, i) => { ys.push(y); if (i < rows.length - 1) y += core[i] + gaps[i]; });
      return { ys, bottom: ys[ys.length - 1] + core[core.length - 1] + tail };
    };
    let gaps = gap0.slice(), lay = place(gaps);
    if (lay.bottom > ceil && gap0.length) {
      const sum = gap0.reduce((a, b) => a + b, 0);
      const k = Math.max(0, (sum - (lay.bottom - ceil)) / sum);
      gaps = gap0.map(g => g * k);
      lay = place(gaps);
    }
    return { ys: lay.ys, bottom: lay.bottom, lead, px, gaps };
  };
  let px = 28, lay = at(px);
  while (px > 20 && lay.gaps.length && Math.min.apply(null, lay.gaps) < 16) { px--; lay = at(px); }
  rows.forEach(r => { r.px = lay.px; r.lead = lay.lead; });
  return { rows, ys: lay.ys, y0, boxH: Math.max(70, Math.min(lay.bottom, ceil) - y0), px: lay.px };
}

function drawPanorama(ctx, st) {
  const R = S.race, t = S.time;
  const xs = st.map(e => e.dist);
  const minX = Math.min(-120, ...xs) - 120, maxX = Math.max(800, ...xs) + 260;

  const V = makeView((minX + maxX) / 2, 800, z);
  drawWorld(ctx, { cond: S.cond, course: S.course, V, t, pieceState: () => ({ time: t }), space: 0 });
  ART.cannon(ctx, V, { angle: 45, burn: 1, t, stick: false });
  // labels for top 5 and last place, small flags for the rest
  const labeled = new Set(st.slice(0, 5).map(e => e.pl.key)); if (st.length > 5) labeled.add(st[st.length - 1].pl.key);
  const sorted = st.slice().sort((a, b) => a.dist - b.dist);
  let lastX = -1e9, lvl = 0;
  const labels = [];
  for (const e of sorted) {
    const sx = V.sx(e.dist), sy = V.sy(SIM.groundY(e.dist));
    const lab = labeled.has(e.pl.key);
    if (lab) { lvl = sx - lastX < 330 ? (lvl + 1) % 5 : 0; lastX = sx; }
    const rank = st.indexOf(e) + 1;
    const h = lab ? 100 + lvl * 62 : 64;
    drawFlag(ctx, sx, sy, h, teamOf(e.pl), null, { t, cloth: 74 });
    if (lab) labels.push([sx, sy, h, e, rank]);
  }
  // the flags carry the players' names, as they do in the salvo and in the copied results: this is the picture for the
  // team chat, and people look for themselves
  for (const [sx, sy, h, e, rank] of labels) drawFlag(ctx, sx, sy, h, teamOf(e.pl), rank + '. ' + e.pl.name, { t, px: 26, maxW: 300, cloth: 74, labelOnly: true });
  // header strip for screenshots
  rr(ctx, 60, 24, 1800, 110, 26); fillStrokeLifted(ctx, 'rgba(255,248,230,0.96)', 5);
  txt(ctx, 'Duck Duck BOOM!  ·  ' + shortDate(R.day) + '  ·  ' + st.length + ' duck' + (st.length === 1 ? '' : 's') + '  ·  ' + modName(S.cond), 960, 66, { px: 40, color: OUT, sw: 0, maxW: 1740 });
  txt(ctx, 'Race ID ' + R.id + (R.practice ? ' · Practice' : '') + (st[0] ? '  ·  Winner: ' + st[0].pl.name + ' · ' + st[0].pl.duck.name + ' · ' + fmtFt(st[0].dist) : ''), 960, 108, { px: 28, color: '#6b6577', sw: 0, maxW: 1740 });
  button(ctx, 'copy', 40, 948, 330, 76, 'Copy results', { bg: '#9be58b', fn: () => copyText(resultsText(R), 'Results for the team chat') });
  button(ctx, 'fame2', 390, 948, 330, 76, 'Waddle of Fame', { fn: () => { FM.back = 'results'; RS.back = true; go('fame'); } });
}

// A probe guards against frame-rate caps (laptop battery saver runs at 30 fps however light the

  const scale = Math.min(w / 1920, h / 1080);
  const ox = (w - 1920 * scale) / 2, oy = (h - 1080 * scale) / 2;
  STAGE.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + scale + ')';
  const dpr = window.devicePixelRatio || 1;
  const k = Math.max(0.42, clamp(scale * dpr, 0.5, 1.5) * QUAL.k);   // up to 1.5x on a sharp screen (a Retina laptop, 1440p); slow frames step it down
  const bw = Math.round(1920 * k), bh = Math.round(1080 * k);

  VIEW = { scale, ox, oy, k: bw / 1920 };
}
function toLogical(e) { return { x: (e.clientX - VIEW.ox) / VIEW.scale, y: (e.clientY - VIEW.oy) / VIEW.scale }; }

CV.addEventListener('pointerdown', e => { primeAudio(); const p = toLogical(e); const b = hitButton(p.x, p.y); S.pressed = b ? b.id : null; });
CV.addEventListener('pointerup', e => { const p = toLogical(e); const b = hitButton(p.x, p.y); if (b && b.id === S.pressed && b.fn) b.fn(); S.pressed = null; });

function typingTarget(e) {
  const t = e.target; if (!t) return false;
  const tag = (t.tagName || '').toLowerCase();

}

// The music for this moment: the lobby tune while people gather and between the big moments, a tension pulse while
// the ducks load and the host is about to light the fuse, the race tune while ducks fly. Silence for the countdown
// and the boom, for the result card's cheer, under the final drumroll, and through the crowning until the fanfare is
// done.
function musicWanted() {
  if (!S.settings.music) return null;
  switch (S.screen) {
    case 'title': return S.rt - primedAt > 2.6 ? 'lobby' : null;   // (the title jingle plays first)
    case 'roster': case 'reveal': case 'fame': return 'lobby';
    case 'launch': {
      if (SFX.drumOn) return null;
      if (L.phase === 'salvo') return SV.phase === 'flight' && SV.pb && !SV.pb.done && SV.pb.T > 0.9 ? 'race' : (SV.phase === 'load' || SV.phase === 'armed') && !SV.replay ? 'arm' : null;

}
// how the race tune plays right now: with only stragglers left its lead steps out (so the chase and Bill's calls

function musicMood() {

    const n = SV.fl.length, mv = SV.fl.filter(f => !f.done).length;

  selfTest() { const r = runSelfTest(); console.log((r.ok ? 'SELF TEST PASSED' : 'SELF TEST FAILED') + '\n' + r.checks.join('\n')); return r; },
  sim, generateDuck, dailyConditions, generateCourse, state: S, store: Store,
  // render a tune on its own (for listening to it, or checking it): resolves with an AudioBuffer
  renderMusic(name, seconds, mood, solo) { const sr = 44100, oc = new OfflineAudioContext(2, Math.ceil(sr * (seconds || 30)), sr), m = makeMusic(oc, oc.destination, { solo }); if (mood) m.mood(mood, 0); m.play(name, 0); m.tick(seconds || 30); return oc.startRendering(); },
};
window.DDB = DDB;

function boot() {
  resize();
  SFX.setVolume(S.settings.volume);
  refreshWorld(true);
  if (S.debugOn) DebugPanel.build();
  const c = savedShow();
  if (S.galleryOn) go('gallery');
  else go('title');
  if (c && !S.galleryOn) Toast.show(c.day === todayKey() ? "Today's show is still going: press the big red button to resume." : 'There is an unfinished show from ' + shortDate(c.day) + '. Press START for a new one, or resume it from the button on the right.', 3600);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && (S.screen === 'title' || S.screen === 'roster') && !S.race) { const before = S.day; checkDayRollover(); if (S.day !== before && S.screen === 'title') go('title'); if (S.day !== before && S.screen === 'roster') Roster.render(); } });
  requestAnimationFrame(frame);
}
boot();

</script>
